<script>
  window.TAB4_DEBTS = window.TAB4_DEBTS || [];
  window.CURRENT_DEBT_TAB = 'all';
  let currentPayContext = { ids: [], name: '', amount: 0, type: 'THU' };

  function t4_parseMathAmount(inputVal) {
      if (inputVal === null || inputVal === undefined) return 0;
      let str = String(inputVal).trim();
      if (!str) return 0;

      // Clean commas (e.g. 1,000,000)
      str = str.replace(/,/g, '');

      // Support 'k' / 'K' (e.g. 50k -> (50*1000)) & 'm' / 'M' (e.g. 1m -> (1*1000000))
      str = str.replace(/(\d+(?:\.\d+)?)\s*[kK]/g, '($1*1000)');
      str = str.replace(/(\d+(?:\.\d+)?)\s*[mM]/g, '($1*1000000)');

      // Validate that string contains only digits, +, -, *, /, (, ), ., and spaces
      if (/^[0-9\s\+\-\*\/\(\)\.]+$/.test(str)) {
          try {
              const res = new Function('return (' + str + ')')();
              if (typeof res === 'number' && !isNaN(res) && isFinite(res)) {
                  return Math.round(res);
              }
          } catch(e) {}
      }

      const num = parseFloat(str);
      return isNaN(num) ? 0 : Math.round(num);
  }

  function t4_onAmountBlur(inputEl) {
      if (!inputEl || !inputEl.value) return;
      const val = t4_parseMathAmount(inputEl.value);
      if (val > 0) {
          inputEl.value = val;
      }
  }

  function t4_initDateFilters() {
      const monthSelect = document.getElementById('t4-filter-month');
      const yearSelect = document.getElementById('t4-filter-year');
      if(!monthSelect || !yearSelect) return;
      
      const d = new Date();
      const currYear = d.getFullYear();

      // MẶC ĐỊNH MỞ MÀN HÌNH LUÔN LÀ CẢ NĂM
      let monthHTML = '<option value="All" selected>All</option>';
      for (let i = 1; i <= 12; i++) {
          monthHTML += `<option value="${i}">Tháng ${i}</option>`;
      }
      monthSelect.innerHTML = monthHTML;

      let yearHTML = '<option value="All" selected>All</option>';
      for (let y = 2024; y <= Math.max(2031, currYear + 5); y++) {
          yearHTML += `<option value="${y}">Năm ${y}</option>`;
      }
      yearSelect.innerHTML = yearHTML;
  }

  function getTodayString() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
  }

  function t4_formatIsoDate(val) {
      if (!val) return getTodayString();
      if (val instanceof Date) {
          if (isNaN(val.getTime())) return getTodayString();
          const yyyy = val.getFullYear();
          const mm = String(val.getMonth() + 1).padStart(2, '0');
          const dd = String(val.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
      }
      const str = String(val).trim();
      if (!str) return getTodayString();
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      if (/^\d{4}-\d{1,2}-\d{1,2}/.test(str)) {
          const parts = str.split(' ')[0].split('-');
          const yyyy = parts[0];
          const mm = parts[1].padStart(2, '0');
          const dd = parts[2].padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
      }
      if (/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(str)) {
          const parts = str.split(' ')[0].split('/');
          const dd = parts[0].padStart(2, '0');
          const mm = parts[1].padStart(2, '0');
          let yyyy = parts[2];
          if (yyyy.length === 2) yyyy = "20" + yyyy;
          return `${yyyy}-${mm}-${dd}`;
      }
      const d = new Date(str);
      if (!isNaN(d.getTime())) {
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
      }
      return getTodayString();
  }

  function applyTab4Data(res) {
      if (!res || !res.success) return;
      window.t1_tab4Data = res;
      if (res.summary) {
          const net = res.summary.net || 0;
          const netEl = document.getElementById('debt-dashboard-net');
          const recEl = document.getElementById('debt-dashboard-receivables');
          const payEl = document.getElementById('debt-dashboard-payables');
          if (netEl) netEl.innerText = (net >= 0 ? '+' : '') + net.toLocaleString() + ' ¥';
          if (recEl) recEl.innerText = (res.summary.receivables || 0).toLocaleString() + ' ¥';
          if (payEl) payEl.innerText = (res.summary.payables || 0).toLocaleString() + ' ¥';
      }
      if (res.partners) {
          window.PARTNER_LIST = res.partners;
      }
      window.TAB4_DEBTS = res.debts || [];
      window.TAB4_ALL_DEBTS = res.allDebts || res.debts || [];

      // Cập nhật số lượng hoàn tất trên huy hiệu Subtab 2
      const doneList = window.TAB4_ALL_DEBTS.filter(item => isDebtDone(item));
      const doneBadge = document.getElementById('debt-done-count');
      if (doneBadge) doneBadge.innerText = doneList.length + ' Mục';

      if (typeof renderDebtCardsList === 'function') {
          if (window.CURRENT_TAB4_SUBTAB === 'datt') {
              renderDebtCardsList(window.TAB4_ALL_DEBTS);
          } else {
              renderDebtCardsList(window.TAB4_DEBTS);
          }
      }
      if (typeof renderTab1Wallets === 'function') {
          renderTab1Wallets();
      }
  }

  function isDebtDone(item) {
      if (!item) return false;
      const st = String(item.trangThai || item.trangThaiDuNo || '').trim().toUpperCase();
      if (st === 'HOAN_TAT' || st === 'DA_TRA' || st === 'DONE' || 
          st.includes('HOÀN TẤT') || st.includes('ĐÃ TRẢ') || st.includes('ĐÃ THANH TOÁN') || st.includes('ĐÃ TT') ||
          st.includes('DA TRA') || st.includes('HOAN TAT') || st.includes('DA THANH TOAN')) {
          return true;
      }
      const tongNo = Number(item.tongNo) || 0;
      const daTra = Number(item.daTra) || 0;
      const duNo = Number(item.duNo) || 0;
      if (tongNo > 0 && duNo <= 0) return true;
      if (daTra > 0 && daTra >= tongNo) return true;
      return false;
  }

  function reloadTab4Data(forceRefresh = true) {
      const monthSelect = document.getElementById('t4-filter-month');
      const yearSelect = document.getElementById('t4-filter-year');
      const month = monthSelect ? monthSelect.value : 'All';
      const year = yearSelect ? yearSelect.value : 'All';

      if (forceRefresh === false && window.TAB4_DEBTS && window.TAB4_DEBTS.length > 0) {
          renderDebtCardsList(window.TAB4_DEBTS);
          return;
      }

  function renderDebtCardsList(debts) {
      const activeTab = window.CURRENT_DEBT_TAB || 'all';
      const isDoneTab = (activeTab === 'done');
      const container = isDoneTab ? (document.getElementById('debt-done-cards') || document.getElementById('debt-all-cards')) : document.getElementById('debt-all-cards');
      const countEl = document.getElementById('debt-list-count');
      const doneCountEl = document.getElementById('debt-done-count');
      const chkSelectAll = document.getElementById('chk-select-all-debts');
      if (!container) return;

      if (chkSelectAll) chkSelectAll.checked = false;

      const sourceList = (isDoneTab && window.TAB4_ALL_DEBTS && window.TAB4_ALL_DEBTS.length > 0) ? window.TAB4_ALL_DEBTS : (debts || window.TAB4_DEBTS || []);

      let filtered = (sourceList || []).filter(item => {
          const lUp = String(item.loai || '').toUpperCase();
          const tUp = (String(item.ten || '') + ' ' + String(item.noidung || '')).toUpperCase();
          const isThu = lUp === 'THU' || lUp === 'CHO_VAY' || lUp.includes('THU') || lUp.includes('KHÁCH') || lUp.includes('CHO VAY') || lUp.includes('CẦN THU') || tUp.includes('CHO VAY') || tUp.includes('KHÁCH NỢ');
          const isDone = isDebtDone(item);

          if (activeTab === 'done') return isDone;
          if (activeTab === 'thu') return isThu && !isDone;
          if (activeTab === 'tra') return !isThu && !isDone;
          return !isDone; // 'all' in Subtab 1 shows active unpaid debts
      });

      if (isDoneTab) {
          if (doneCountEl) doneCountEl.innerText = `${filtered.length} Mục`;
      } else {
          if (countEl) countEl.innerText = `${filtered.length} Mục`;
      }

      if (filtered.length === 0) {
          container.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">${isDoneTab ? 'Chưa có khoản công nợ nào hoàn tất.' : 'Không có khoản công nợ nào đang hoạt động.'}</div>`;
          calcBulkPay();
          return;
      }

      // VẼ DANH SÁCH THẺ (Nền trắng sạch, chỉ tô màu giá tiền: Xanh thu / Đỏ trả)
      container.innerHTML = filtered.map(item => {
          const lUp = String(item.loai || '').toUpperCase();

          const isThu = lUp === 'THU' || lUp === 'CHO_VAY' || lUp.includes('THU') || lUp.includes('KHÁCH') || lUp.includes('CHO VAY') || lUp.includes('CẦN THU') || tUp.includes('CHO VAY') || tUp.includes('KHÁCH NỢ');

          const payBtnText = isThu ? '💰 Nhận' : '💸 Trả';
          const payBtnBg = isThu ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-rose-600 hover:bg-rose-700 text-white';

          return `
              <div class="debt-card p-1.5 px-2 rounded-xl border transition text-xs space-y-0.5 cursor-pointer shadow-2xs ${cardStyle}" id="card-debt-${item.id}" onclick="openEditDebtModal('${item.id}')">
                  <div class="flex justify-between items-center gap-1.5">
                      <div class="flex items-center gap-1.5 flex-1 min-w-0">
                          ${!isDone ? `
                          <input type="checkbox" id="chk-debt-${item.id}" class="chk-debt-item accent-indigo-600 w-3.5 h-3.5 cursor-pointer shrink-0" 
                                 data-id="${item.id}" data-amount="${item.duNo}" data-name="${(item.ten || '').replace(/"/g, '&quot;')}" 
                                 data-loai="${item.loai}" data-noidung="${(item.noidung || '').replace(/"/g, '&quot;')}" data-ngay="${item.ngay || ''}" 
                                 onchange="calcBulkPay()" onclick="event.stopPropagation()" />
                          ` : `
                          <span class="w-3.5 h-3.5 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold flex items-center justify-center shrink-0">✓</span>
                          `}
                          <span class="card-name font-bold text-[11px] truncate flex-1 min-w-0 text-slate-800">
                              ${item.ten || 'Không tên'} 
                              <span class="text-[9px] text-slate-500 font-normal">(${item.noidung || 'Ghi nợ'})</span>
                          </span>
                      </div>
                      <div class="text-right shrink-0">
                          <span class="font-bold ${amtColor} text-[11px]">${amtSign}${displayAmt.toLocaleString()} ¥</span>

                  </div>
                  <div class="flex justify-between items-center pt-0.5 border-t border-slate-100 text-[9px] text-slate-500 flex-wrap gap-1">

                      <div class="flex gap-1 items-center shrink-0">

  let currentBulkAmount = 0;
  let currentBulkCount = 0;
  let currentBulkIds = [];
  let currentBulkItems = [];

  function calcBulkPay() {
      let sumThu = 0;
      let sumTra = 0;
      let count = 0;
      let selectedIds = [];
      let selectedItems = [];
      const chks = document.querySelectorAll('.chk-debt-item:checked');

      chks.forEach(c => {
          const amt = parseInt(c.getAttribute('data-amount')) || 0;
          const loai = c.getAttribute('data-loai');
          const isThu = (loai === 'THU' || loai === 'CHO_VAY');
          if (isThu) sumThu += amt;
          else sumTra += amt;

          count++;
          selectedIds.push(c.getAttribute('data-id'));
          selectedItems.push({
              id: c.getAttribute('data-id'),
              name: c.getAttribute('data-name'),
              loai: loai,
              amount: amt,
              noidung: c.getAttribute('data-noidung'),
              ngay: c.getAttribute('data-ngay')
          });
      });

      const netBalance = sumThu - sumTra;
      const netSign = netBalance >= 0 ? '+' : '';

      const bar = document.getElementById('bulk-pay-bar');
      if (!bar) return;

      currentBulkAmount = Math.abs(netBalance);
      currentBulkCount = count;
      currentBulkIds = selectedIds;
      currentBulkItems = selectedItems;

      if (count > 0) {
          bar.classList.remove('hidden');
          bar.classList.add('flex');
          document.getElementById('bulk-count').innerText = count;
          document.getElementById('bulk-total').innerText = netSign + netBalance.toLocaleString() + ' ¥';
      } else {
          bar.classList.add('hidden');
          bar.classList.remove('flex');
      }
  }

  function submitAddDebt() {
      const btn = document.getElementById('btn-add-debt-submit');
      if (btn && btn.disabled) return;

      const id = document.getElementById('add-debt-id').value.trim();
      const loai = document.getElementById('add-debt-loai').value;
      const ngay = document.getElementById('add-debt-date').value;
      const ten = document.getElementById('add-debt-name').value.trim();
      const rawAmountStr = document.getElementById('add-debt-amount').value;

      if(!ten) {

      if(sotien <= 0) {
          showToast("⚠️ Vui lòng nhập số tiền hợp lệ lớn hơn 0!", true);
          return;
      }

      const origText = btn ? btn.innerText : 'Lưu Khoản Nợ';

          btn.innerText = "⏳ Đang lưu...";

              btn.innerText = origText;
          }
      }

      const reqId = (typeof generateClientRequestId === 'function') ? generateClientRequestId("REQ_DEBT_") : ("REQ_DEBT_" + Date.now());
      const payload = {
          requestId: reqId,
          id: id,
          ngay: ngay,

          loai: loai,
          sotien: sotien,
          nguon: nguon,
          noidung: noidung
      };

      if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.saveDebtTransaction === 'function') {
          google.script.run

                  restoreAddBtn();

                  } else {

      }

          btn.innerText = "⏳ Đang xử lý...";
      }

      const reqIdSettle = (typeof generateClientRequestId === 'function') ? generateClientRequestId("REQ_DS_") : ("REQ_DS_" + Date.now());
      const payload = {
          requestId: reqIdSettle,
          ids: currentPayContext.ids,
          name: currentPayContext.name,
          amount: amtVal,
          date: dateStr,
          sourceWallet: source
      };

      if (currentPayContext.type === 'THU_TAB3') {
          if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.confirmBatchDebtSalesPayment === 'function') {
              google.script.run
                  .withSuccessHandler(function(res) {
                      restorePayBtn();
                      if (res && res.success) {
                          showToast(res.message || "✅ Đã thu tiền đơn khách nợ thành công!");
                          closeModal('modal-pay-debt');
                          if (res.freshData && typeof applyTab3Data === 'function') applyTab3Data(res.freshData);
                          else if (typeof reloadTab3Data === 'function') reloadTab3Data();
                          if (res.updatedWallets && typeof mergeUpdatedWallets === 'function') {
                              mergeUpdatedWallets(res.updatedWallets);
                          }
                          if (res.dataVersion && window.APP_CLIENT_VERSION !== undefined) {
                              window.APP_CLIENT_VERSION = Number(res.dataVersion);
                          }
                      } else {
                          showToast("❌ " + (res ? res.message : "Thu tiền thất bại"), true);
                      }
                  })
                  .withFailureHandler(function(err) {
                      restorePayBtn();
                      showToast("❌ Lỗi kết nối: " + (err ? (err.message || err) : "Lỗi gửi dữ liệu"), true);
                  })
                  .confirmBatchDebtSalesPayment(currentPayContext.ids, source, dateStr);
          } else {
              restorePayBtn();
              closeModal('modal-pay-debt');
              showToast(`✅ [Demo] Đã thu tiền ${currentPayContext.ids.length} đơn vào ${source}!`);
          }
          return;
      }

      if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.settleDebtPayment === 'function') {
          google.script.run
              .withSuccessHandler(function(res) {
                  restorePayBtn();
                  if (res && res.success) {
                      showToast(res.message || "✅ Đã gạch nợ thành công!");
                      closeModal('modal-pay-debt');
                      reloadTab4Data();
                      if (res.updatedWallets && typeof mergeUpdatedWallets === 'function') {
                          mergeUpdatedWallets(res.updatedWallets);
                      }
                      if (res.dataVersion && window.APP_CLIENT_VERSION !== undefined) {
                          window.APP_CLIENT_VERSION = Number(res.dataVersion);
                      }
                  } else {
                      showToast("❌ " + (res ? res.message : "Thanh toán thất bại"), true);
                  }
              })
              .withFailureHandler(function(err) {
                  restorePayBtn();
                  showToast("❌ Lỗi kết nối: " + (err ? (err.message || err) : "Không thể gửi dữ liệu"), true);
              })
              .settleDebtPayment(payload);
      } else {
          restorePayBtn();
          showToast(`✅ Đã thanh toán (Demo)! ${amtVal.toLocaleString()} ¥`, false);
          closeModal('modal-pay-debt');
      }

      function restorePayBtn() {
          if (btn) {
              btn.disabled = false;
              btn.classList.remove('opacity-50', 'pointer-events-none');
              btn.innerText = origText;
          }
      }
  }

  function openExportDebtReportModal() {
      if (currentBulkItems.length === 0) {
          showToast("⚠️ Vui lòng chọn ít nhất 1 khoản nợ để tạo báo cáo ảnh!", true);
          return;
      }

      const firstPartner = currentBulkItems[0].name || 'ĐỐI TÁC';
      const allSamePartner = currentBulkItems.every(it => (it.name || '').trim().toLowerCase() === firstPartner.trim().toLowerCase());
      const partnerDisplayName = allSamePartner ? firstPartner : 'BÁO CÁO TỔNG HỢP';

      document.getElementById('rpt-partner-name').innerText = partnerDisplayName;
      document.getElementById('rpt-date-str').innerText = getTodayString();

      let sumThu = 0;
      let sumTra = 0;

      const rowsHtml = currentBulkItems.map(it => {
          const isThu = (it.loai === 'THU' || it.loai === 'CHO_VAY');
          const amt = Number(it.amount) || 0;
          if (isThu) sumThu += amt;
          else sumTra += amt;

          const amtStr = (isThu ? '+' : '-') + amt.toLocaleString() + ' ¥';
          const amtClass = isThu ? 'text-emerald-600 font-bold' : 'text-rose-600 font-bold';

          return `
              <div class="grid grid-cols-12 px-2 py-1.5 text-center items-center">
                  <span class="col-span-3 text-[10px] text-slate-500 font-medium">${it.ngay || getTodayString()}</span>
                  <span class="col-span-5 text-[10px] font-bold text-slate-700 truncate text-left pl-1">${it.noidung || 'Ghi nợ'}</span>
                  <span class="col-span-4 text-right ${amtClass} text-[11px] pr-1">${amtStr}</span>
              </div>
          `;
      }).join('');

      document.getElementById('rpt-table-body').innerHTML = rowsHtml;

      const netBalance = sumThu - sumTra;
      const netSign = netBalance >= 0 ? '+' : '';

      document.getElementById('rpt-sum-thu').innerText = '+' + sumThu.toLocaleString() + ' ¥';
      document.getElementById('rpt-sum-tra').innerText = '-' + sumTra.toLocaleString() + ' ¥';
      document.getElementById('rpt-sum-net').innerText = netSign + netBalance.toLocaleString() + ' ¥';

      openModal('modal-export-debt-image');
  }

  function copyDebtReportImageToClipboard() {
      const el = document.getElementById('debt-report-preview');
      const btn = document.getElementById('btn-copy-rpt-img');
      if (!el || typeof html2canvas === 'undefined') {
          showToast("❌ Chưa sẵn sàng thư viện chụp ảnh!", true);
          return;
      }

      const origText = btn ? btn.innerHTML : '<span>📋</span> <span>Sao Chép Ảnh</span>';
      if (btn) {
          btn.disabled = true;
          btn.innerText = "⏳ Đang tạo ảnh...";
      }

      html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
          canvas.toBlob(blob => {
              if (!blob) {
                  if (btn) { btn.disabled = false; btn.innerHTML = origText; }
                  showToast("❌ Lỗi tạo file ảnh!", true);
                  return;
              }
              if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
                  navigator.clipboard.write([
                      new ClipboardItem({ 'image/png': blob })
                  ]).then(() => {
                      if (btn) { btn.disabled = false; btn.innerHTML = origText; }
                      showToast("✅ Đã sao chép ảnh báo cáo vào Clipboard! Bạn có thể dán (Ctrl+V) gửi ngay.");
                  }).catch(err => {
                      if (btn) { btn.disabled = false; btn.innerHTML = origText; }
                      downloadDebtReportImage();
                  });
              } else {
                  if (btn) { btn.disabled = false; btn.innerHTML = origText; }
                  downloadDebtReportImage();
              }
          }, 'image/png');
      }).catch(err => {
          if (btn) { btn.disabled = false; btn.innerHTML = origText; }
          showToast("❌ Lỗi xuất ảnh: " + err, true);
      });
  }

  function downloadDebtReportImage() {
      const el = document.getElementById('debt-report-preview');
      const btn = document.getElementById('btn-download-rpt-img');
      if (!el || typeof html2canvas === 'undefined') {
          showToast("❌ Chưa sẵn sàng thư viện chụp ảnh!", true);
          return;
      }

      const origText = btn ? btn.innerHTML : '<span>📥</span> <span>Tải File</span>';
      if (btn) {
          btn.disabled = true;
          btn.innerText = "⏳ Đang tạo...";
      }

      html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
          if (btn) {
              btn.disabled = false;
              btn.innerHTML = origText;
          }
          const link = document.createElement('a');
          const pName = (document.getElementById('rpt-partner-name')?.innerText || 'CongNo').replace(/[^a-zA-Z0-9_\-]/g, '_');
          link.download = `BaoCao_CongNo_${pName}_${getTodayString()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          showToast("✅ Đã tải file ảnh báo cáo công nợ!");
      }).catch(err => {
          if (btn) {
              btn.disabled = false;
              btn.innerHTML = origText;
          }
          showToast("❌ Lỗi xuất ảnh: " + err, true);
      });
  }

  function confirmDeleteDebt(id) {
      if (typeof showConfirmModal === 'function') {
          showConfirmModal("⚠️ Xóa Bản Ghi Công Nợ", `Bạn có chắc chắn muốn xóa bản ghi công nợ (${id}) không?`, function() {
              const reqIdDel = (typeof generateClientRequestId === 'function') ? generateClientRequestId("REQ_DD_") : ("REQ_DD_" + Date.now());
              if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.deleteDebtRecord === 'function') {
                  showToast("⏳ Đang xóa bản ghi công nợ...");
                  google.script.run
                      .withSuccessHandler(function(res) {
                          if (res && res.success) {
                              showToast(res.message || "✅ Đã xóa bản ghi công nợ!");
                              reloadTab4Data();
                              if (res.updatedWallets && typeof mergeUpdatedWallets === 'function') {
                                  mergeUpdatedWallets(res.updatedWallets);
                              }
                              if (res.dataVersion && window.APP_CLIENT_VERSION !== undefined) {
                                  window.APP_CLIENT_VERSION = Number(res.dataVersion);
                              }
                          } else {
                              showToast("❌ " + (res ? res.message : "Xóa thất bại"), true);
                          }
                      })
                      .withFailureHandler(function(err) {
                          showToast("❌ Lỗi xóa bản ghi: " + (err ? (err.message || err) : "Không thể xóa"), true);
                      })
                      .deleteDebtRecord({ id: id, requestId: reqIdDel });
              } else {
                  showToast("✅ Đã xóa bản ghi (Demo)!");
              }
          }, "Xóa Ngay");
      }
  }

  if(typeof openModal === 'undefined') {
      window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
      window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };
  }

  window.copyDebtReportImageToClipboard = copyDebtReportImageToClipboard;
  window.downloadDebtReportImage = downloadDebtReportImage;
  window.openExportDebtReportModal = openExportDebtReportModal;
  window.openPayModal = openPayModal;
  window.openPayDebtModal = openPayModal;
  window.submitPayDebt = submitPayDebt;
</script>
