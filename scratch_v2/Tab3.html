    <!-- HEADER -->
    <div class="pt-10 pb-4 px-5 text-white bg-teal-600 shadow-md flex justify-between items-center z-10 relative shrink-0">
      <h1 class="text-lg font-bold">📦 Kinh Doanh</h1>
      <div class="flex gap-2">
          <select id="t3-filter-month" class="bg-teal-700/80 border border-teal-400 text-white text-xs px-2.5 py-1.5 rounded-xl font-medium outline-none cursor-pointer"></select>
          <select id="t3-filter-year" class="bg-teal-700/80 border border-teal-400 text-white text-xs px-2.5 py-1.5 rounded-xl font-medium outline-none cursor-pointer"></select>
      </div>
    </div>

    <!-- KHU VỰC CUỘN CHÍNH -->
    <div class="flex-1 overflow-y-auto p-4 pb-6 flex flex-col relative z-0">
      
      <!-- DASHBOARD KINH DOANH -->
      <div class="bg-gradient-to-br from-teal-500 to-emerald-700 text-white p-5 rounded-3xl shadow-lg relative overflow-hidden mb-4 shrink-0">
        <p class="text-[10px] uppercase tracking-wider text-teal-100">Lợi Nhuận Gộp Tháng Này</p>
        <h2 class="text-3xl font-bold mt-1">+45,000 ¥</h2>
        <div class="flex gap-2 mt-4 pt-4 border-t border-teal-400/50">
             <div class="flex-1">
                 <p class="text-[9px] text-teal-100 uppercase font-bold mb-0.5">Tổng Bán</p>
                 <p class="text-sm font-bold text-white">150,000 ¥</p>
             </div>
             <div class="flex-1 border-l border-teal-400/50 pl-2">
                 <p class="text-[9px] text-teal-100 uppercase font-bold mb-0.5">Vốn Hàng Xuất</p>
                 <p class="text-sm font-bold text-teal-200">-105,000 ¥</p>
             </div>
        </div>
        <p class="text-[9px] text-teal-100 absolute top-4 right-4 bg-black/20 px-2 py-1 rounded">Tồn kho: 80,000 ¥</p>
      </div>

      <!-- TABS NẰM NGAY DƯỚI DASHBOARD -->
      <div class="flex p-1 bg-slate-200 rounded-xl mb-4 shrink-0">
          <button onclick="switchBizTab('mua')" id="btn-biz-mua" class="flex-1 py-2 text-xs font-bold bg-white text-teal-600 rounded-lg shadow-sm cursor-pointer transition">1. Nhập Mua</button>
          <button onclick="switchBizTab('ban')" id="btn-biz-ban" class="flex-1 py-2 text-xs font-bold text-slate-500 rounded-lg cursor-pointer transition">2. Xuất Bán</button>
          <button onclick="switchBizTab('kho')" id="btn-biz-kho" class="flex-1 py-2 text-xs font-bold text-slate-500 rounded-lg cursor-pointer transition">3. QL Kho</button>
      </div>

      <!-- ============================================== -->
      <!-- 1. FORM NHẬP MUA HÀNG                          -->
      <!-- ============================================== -->
      <div id="biz-mua" class="space-y-4 bg-white p-4 border border-slate-200 rounded-2xl shadow-sm shrink-0">
        <h3 class="font-bold text-slate-800 text-sm border-b pb-2">🛒 Nhập Mua Hàng Mới</h3>
        
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">1. Ngày mua</label>
            <input type="date" value="2026-09-04" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none focus:border-teal-500">
        </div>

        <div class="grid grid-cols-2 gap-3 relative z-[60]">
            <div class="relative">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">2. Nơi Mua</label>
                <input type="text" id="mua-noi" autocomplete="off" placeholder="Amazon, Donki..." 
                       oninput="t3_renderSuggest('mua-noi', 'noimua')" onfocus="t3_renderSuggest('mua-noi', 'noimua')" onblur="t3_hideSuggest('mua-noi')"
                       class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-800 outline-none focus:border-teal-500">
                <div id="box-mua-noi" class="suggest-box absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl hidden max-h-40 overflow-y-auto z-50"></div>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Trạng thái Kho</label>
                <select class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2 py-2 text-xs font-bold text-teal-700 outline-none focus:border-teal-500 cursor-pointer">
                    <option>📦 Chờ Ship (Online)</option>
                    <option>🟢 Vào Kho Nhật</option>
                    <option>✴️ Vào Kho VN</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">3. Danh Sách Sản Phẩm Mua</label>
            <div id="mua-items-container" class="space-y-3 border-l-2 border-teal-200 pl-3 ml-1 mb-3"></div>
            <button onclick="addMuaItem()" class="text-xs font-bold text-teal-600 bg-teal-50 hover:bg-teal-100 transition px-3 py-2 rounded-lg cursor-pointer">➕ Thêm Sản Phẩm Khác</button>
        </div>
        
        <div class="relative z-[40]">
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">4. Nguồn tiền mua</label>
            <input type="text" id="mua-nguon" autocomplete="off" placeholder="Thẻ hoặc Ví..." 
                   oninput="t3_renderSuggest('mua-nguon', 'nguon')" onfocus="t3_renderSuggest('mua-nguon', 'nguon')" onblur="t3_hideSuggest('mua-nguon')"
                   class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-bold text-slate-700 outline-none focus:border-teal-500">
            <div id="box-mua-nguon" class="suggest-box absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl hidden max-h-40 overflow-y-auto z-50"></div>
        </div>
        
        <div class="bg-blue-50 border border-blue-100 p-3 rounded-xl mt-3 space-y-3 relative z-[30]">
            <label class="flex items-start gap-2 cursor-pointer group">
                <input type="checkbox" class="mt-0.5 accent-blue-600 w-4 h-4 cursor-pointer" checked>
                <div>
                    <p class="text-xs font-bold text-slate-800 group-hover:text-blue-700">Hàng Pre-order (Chờ trừ thẻ)</p>
                    <p class="text-[9px] text-slate-500 leading-tight mt-0.5">Đơn sẽ lưu vào Kho nhưng chưa trừ tiền ở Ví/Thẻ ngay.</p>
                </div>
            </label>
            
            <label class="flex items-start gap-2 cursor-pointer border-t border-blue-100/50 pt-3 group">
                <input type="checkbox" id="chk-muon-the" onchange="toggleDoitac()" class="mt-0.5 accent-blue-600 w-4 h-4 cursor-pointer">
                <div>
                    <p class="text-xs font-bold text-slate-800 group-hover:text-blue-700">Mượn thẻ/tiền đối tác (Sinh Công Nợ)</p>
                    <p class="text-[9px] text-slate-500 leading-tight mt-0.5">Ghi thẳng vào sổ nợ, không trừ tiền thẻ của mình.</p>
                </div>
            </label>
            
            <div id="div-doitac" class="hidden pl-6 relative z-50">
                <input type="text" id="mua-doitac" autocomplete="off" placeholder="Gõ tên đối tác cho mượn..." 
                       oninput="t3_renderSuggest('mua-doitac', 'doitac')" onfocus="t3_renderSuggest('mua-doitac', 'doitac')" onblur="t3_hideSuggest('mua-doitac')"
                       class="w-full bg-white border border-blue-200 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-700 outline-none focus:border-blue-500 shadow-inner relative z-20">
                <div id="box-mua-doitac" class="suggest-box absolute left-6 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-2xl hidden max-h-32 overflow-y-auto z-[100]"></div>
            </div>
        </div>
        
        <button onclick="alert('Đã lưu dữ liệu đơn mua hàng!')" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-sm font-bold shadow-md transition mt-4 cursor-pointer relative z-10">Lưu Toàn Bộ Đơn Mua Hàng</button>
      </div>


      <!-- ============================================== -->
      <!-- 2. FORM XUẤT BÁN HÀNG                          -->
      <!-- ============================================== -->
      <div id="biz-ban" class="space-y-4 bg-white p-4 border border-slate-200 rounded-2xl shadow-sm hidden shrink-0">
        <h3 class="font-bold text-slate-800 text-sm border-b pb-2">🏷️ Xuất Bán Hàng</h3>
        
        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">1. Ngày bán</label>
            <input type="date" value="2026-09-04" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none focus:border-teal-500">
        </div>

        <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">2. Danh Sách Sản Phẩm Xuất Kho</label>
            <div id="ban-items-container" class="space-y-3 border-l-2 border-amber-200 pl-3 ml-1 mb-3"></div>
            <button onclick="addBanItem()" class="text-xs font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 transition px-3 py-2 rounded-lg cursor-pointer">➕ Thêm Hàng Để Bán</button>
        </div>

        <div class="relative z-40 mt-2 border-t pt-3">
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">3. Thu Tiền Vào Ví</label>
            <input type="text" id="ban-nguon" autocomplete="off" placeholder="Ví Tiền Mặt..." 
                   oninput="t3_renderSuggest('ban-nguon', 'nguon')" onfocus="t3_renderSuggest('ban-nguon', 'nguon')" onblur="t3_hideSuggest('ban-nguon')"
                   class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none focus:border-teal-500">
            <div id="box-ban-nguon" class="suggest-box absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl hidden max-h-40 overflow-y-auto z-50"></div>
        </div>
        
        <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl mt-3 relative z-10">
            <label class="flex items-start gap-2 cursor-pointer group">
                <input type="checkbox" class="mt-0.5 accent-amber-600 w-4 h-4 cursor-pointer" checked>
                <div>
                    <p class="text-xs font-bold text-slate-800 group-hover:text-amber-700">Khách Nợ (Chưa thanh toán)</p>
                    <p class="text-[9px] text-slate-500 leading-tight mt-0.5">Tiền chưa cộng vào ví lúc này. Giao dịch
