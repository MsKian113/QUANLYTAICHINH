<div class="space-y-4 pb-16 max-w-md mx-auto">
    <!-- Khối tổng quan phía trên (Tông hồng chủ đạo) -->
    <div class="bg-gradient-to-br from-pink-500 to-rose-600 text-white p-5 rounded-3xl shadow-lg relative overflow-hidden">
        <div class="flex justify-between items-center mb-3">
            <div>
                <p class="text-xs uppercase tracking-wider text-pink-100 font-medium">Tài sản / Ví</p>
                <h2 class="text-xl font-bold tracking-tight">財布 (Wallet)</h2>
            </div>
            <button onclick="openWalletModal()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-xl text-xs font-semibold backdrop-blur-md transition flex items-center gap-1 border border-white/20 shadow-xs">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Thêm mới
            </button>
        </div>

        <div class="my-3">
            <p id="ui-total-balance-main" class="text-3xl sm:text-4xl font-extrabold tracking-tight">0 ¥</p>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-3 border-t border-white/15 mt-3">
            <div>
                <p class="text-[10px] uppercase tracking-wider text-pink-200">Tổng Hạn Mức</p>
                <p id="ui-total-credit" class="text-sm sm:text-base font-bold text-white mt-0.5">0 ¥</p>
            </div>
            <div>
                <p class="text-[10px] uppercase tracking-wider text-pink-200">Tổng Số Dư</p>
                <p id="ui-total-debit" class="text-sm sm:text-base font-bold text-white mt-0.5">0 ¥</p>
            </div>
        </div>
    </div>

    <!-- THANH CHUYỂN ĐỔI TAB CON -->
    <div class="grid grid-cols-2 gap-1 bg-slate-200/80 p-1 rounded-2xl shadow-xs">
        <button onclick="switchWalletSubTab('debit')" id="btn-subtab-debit" class="py-2.5 text-xs font-bold rounded-xl transition bg-white text-pink-600 shadow-xs text-center">
            💵 Tiền Mặt & Tài Khoản
        </button>
        <button onclick="switchWalletSubTab('credit')" id="btn-subtab-credit" class="py-2.5 text-xs font-bold rounded-xl transition text-slate-600 text-center">
            💳 Thẻ Tín Dụng
        </button>
    </div>

    <!-- KHU VỰC HIỂN THỊ NỘI DUNG -->
    <div class="space-y-4">
        <div id="wallet-tab-debit" class="space-y-2">
            <div id="debit-card-container" class="space-y-2.5"></div>
        </div>
        <div id="wallet-tab-credit" class="space-y-2 hidden">
            <div id="credit-card-container" class="space-y-2.5"></div>
        </div>
    </div>
</div>

<!-- Modal Thêm / Sửa Ví -->
<div id="wallet-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 hidden">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl border border-slate-100 max-h-[85vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
            <h3 id="wallet-modal-title" class="text-base sm:text-lg font-bold text-slate-900">Thêm Ví Mới</h3>
            <button onclick="closeWalletModal()" class="text-slate-400 hover:text-slate-600 p-1.5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form id="wallet-form-element" onsubmit="handleWalletSubmit(event)" class="space-y-3.5">
            <input type="hidden" id="f-wallet-id">
            
            <div>
                <label class="block text-[11px] font-semibold text-slate-600 uppercase mb-1">Tên ví / Thẻ</label>
                <input type="text" id="f-wallet-name" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white" placeholder="VD: C- Yodo KA, Resona...">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 uppercase mb-1">Loại nguồn</label>
                    <select id="f-wallet-type" onchange="toggleWalletFields()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white">
                        <option value="CREDIT">CREDIT</option>
                        <option value="DEBIT_CASH">DEBIT / Tiền mặt</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 uppercase mb-1">Số dư (¥)</label>
                    <input type="number" id="f-wallet-balance" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white" placeholder="0">
                </div>
            </div>

            <div id="credit-fields" class="space-y-3 pt-1">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 uppercase mb-1">Hạn mức tín dụng (¥)</label>
                    <input type="number" id="f-wallet-limit" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white" placeholder="500000">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 uppercase mb-1">Ngày chốt sao kê</label>
                        <input type="number" id="f-wallet-closing" min="1" max="31" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white" placeholder="10">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 uppercase mb-1">Ngày thanh toán</label>
                        <input type="number" id="f-wallet-due" min="1" max="31" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white" placeholder="27">
                    </div>
                </div>
            </div>

            <div class="flex gap-3 pt-3 border-t border-slate-100">
                <button type="button" onclick="closeWalletModal()" class="flex-1 px-4 py-3 border border-slate-300 rounded-xl text-slate-600 text-xs sm:text-sm font-semibold hover:bg-slate-50">Hủy</button>
                <button type="submit" class="flex-1 px-4 py-3 bg-pink-600 hover:bg-pink-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-sm">Lưu lại</button>
            </div>
        </form>
    </div>
</div>

<script>

/* ========================================================================== */
/* MODULE QUẢN LÝ VÍ & THẺ - TỐI ƯU 0 GIÂY & ĐỒNG BỘ GIAO DIỆN CHUẨN XÁC      */
/* ========================================================================== */

let walletData = [];
let isWalletDataLoaded = false;

// 1. GỌI TẢI NGẦM NGAY KHI MỞ TRANG WEB
document.addEventListener("DOMContentLoaded", function() {
    fetchWalletsSilently();
});

// Hàm tải ngầm không hiện thông báo loading để sẵn sàng dữ liệu đệm
function fetchWalletsSilently() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler(function(data) {
                walletData = data || [];
                isWalletDataLoaded = true;
                // Nếu các container đã sẵn sàng trên UI, tự động render luôn
                if (document.getElementById('debit-card-container')) {
                    renderWalletUI();
                }
            })
            .withFailureHandler(function(err) {
                console.error("Lỗi tải ngầm dữ liệu ví: ", err);
            })
            .getWalletsFromSheet();
    }
}

// 2. HÀM GỌI CHÍNH KHI BẤM VÀO TAB VÍ (Đọc từ cache: Tốc độ 0 giây)
function loadWalletsData(forceRefresh = false) {
    const debitContainer = document.getElementById('debit-card-container');
    const creditContainer = document.getElementById('credit-card-container');
    if (!debitContainer || !creditContainer) return;

    // Nếu đã có dữ liệu trong bộ nhớ đệm, render ngay lập tức không cần chờ mạng
    if (isWalletDataLoaded && !forceRefresh) {
        renderWalletUI();
        return;
    }

    // Nếu chưa kịp tải ngầm, hiển thị trạng thái đang tải và lấy dữ liệu
    debitContainer.innerHTML = `<p class="text-xs text-slate-400 italic px-1 animate-pulse">Đang tải dữ liệu ví...</p>`;
    creditContainer.innerHTML = `<p class="text-xs text-slate-400 italic px-1 animate-pulse">Đang tải dữ liệu thẻ...</p>`;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler(function(data) {
                walletData = data || [];
                isWalletDataLoaded = true;
                renderWalletUI();
            })
            .withFailureHandler(function(err) {
                console.error("Lỗi tải dữ liệu ví: ", err);
                debitContainer.innerHTML = `<p class="text-xs text-rose-500 italic px-1">Lỗi tải dữ liệu.</p>`;
            })
            .getWalletsFromSheet();
    }
}

function switchWalletSubTab(tab) {
    const debitTab = document.getElementById('wallet-tab-debit');
    const creditTab = document.getElementById('wallet-tab-credit');
    const btnDebit = document.getElementById('btn-subtab-debit');
    const btnCredit = document.getElementById('btn-subtab-credit');

    if (!debitTab || !creditTab || !btnDebit || !btnCredit) return;

    if (tab === 'debit') {
        debitTab.classList.remove('hidden');
        creditTab.classList.add('hidden');
        btnDebit.className = "py-2.5 text-xs font-bold rounded-xl transition bg-white text-pink-600 shadow-xs text-center";
        btnCredit.className = "py-2.5 text-xs font-bold rounded-xl transition text-slate-600 text-center";
    } else {
        debitTab.classList.add('hidden');
        creditTab.classList.remove('hidden');
        btnDebit.className = "py-2.5 text-xs font-bold rounded-xl transition text-slate-600 text-center";
        btnCredit.className = "py-2.5 text-xs font-bold rounded-xl transition bg-white text-pink-600 shadow-xs text-center";
    }
}

function renderWalletUI() {
    const debitContainer = document.getElementById('debit-card-container');
    const creditContainer = document.getElementById('credit-card-container');
    if (!debitContainer || !creditContainer) return;

    debitContainer.innerHTML = '';
    creditContainer.innerHTML = '';

    let totalCredit = 0;
    let totalDebit = 0;
    let grandTotal = 0;

    const creditList = walletData.filter(item => item.type && String(item.type).includes('CREDIT'));
    const debitList = walletData.filter(item => item.type && !String(item.type).includes('CREDIT'));

    walletData.forEach(item => {
        const bal = Number(item.current_balance) || 0;
        if (item.type && String(item.type).includes('CREDIT')) {
            totalCredit += Number(item.credit_limit) || 0;
            grandTotal -= bal;
        } else {
            totalDebit += bal;
            grandTotal += bal;
        }
    });

    if (debitList.length === 0) {
        debitContainer.innerHTML = `<p class="text-xs text-slate-400 italic px-1">Chưa có nguồn tiền nào.</p>`;
    } else {
        debitList.forEach(item => {
            const bal = Number(item.current_balance) || 0;
            debitContainer.innerHTML += `
                <div class="bg-white border border-slate-200/80 rounded-2xl px-4 py-3.5 shadow-xs flex items-center justify-between gap-3 hover:border-pink-200 transition">
                    <div class="min-w-0 pr-2">
                        <div class="flex items-center gap-2">
                            <h4 class="text-sm font-bold text-slate-900 truncate">${item.name}</h4>
                            <span class="text-[9px] px-1.5 py-0.5 rounded font-bold bg-emerald-50 text-emerald-700">${item.type}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5">Tài khoản / Tiền mặt</p>
                    </div>
                    <div class="text-right shrink-0 flex items-center gap-3">
                        <div>
                            <p class="text-sm sm:text-base font-bold text-slate-900">${bal.toLocaleString()} <span class="text-xs font-normal text-slate-400">¥</span></p>
                            <div class="flex justify-end gap-2 mt-0.5 text-[11px]">
                                <button onclick="editWalletItem('${item.id}')" class="text-blue-600 hover:underline font-medium">Sửa</button>
                                <span class="text-slate-300">|</span>
                                <button onclick="deleteWalletItem('${item.id}')" class="text-rose-500 hover:underline font-medium">Xóa</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    if (creditList.length === 0) {
        creditContainer.innerHTML = `<p class="text-xs text-slate-400 italic px-1">Chưa có thẻ tín dụng nào.</p>`;
    } else {
        creditList.forEach(item => {
            const bal = Number(item.current_balance) || 0;
            const limit = Number(item.credit_limit || 0).toLocaleString();
            const closing = item.closing_date || '--';
            const due = item.due_date || '--';

            creditContainer.innerHTML += `
                <div class="bg-white border border-slate-200/80 rounded-2xl px-4 py-3.5 shadow-xs flex items-center justify-between gap-3 hover:border-pink-200 transition">
                    <div class="min-w-0 pr-2">
                        <div class="flex items-center gap-2">
                            <h4 class="text-sm font-bold text-slate-900 truncate">${item.name}</h4>
                            <span class="text-[9px] px-1.5 py-0.5 rounded font-bold bg-pink-50 text-pink-700">${item.type}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5">Hạn mức: ${limit} ¥ • ${closing}/${due}</p>
                    </div>
                    <div class="text-right shrink-0 flex items-center gap-3">
                        <div>
                            <p class="text-sm sm:text-base font-bold text-pink-600">${bal.toLocaleString()} <span class="text-xs font-normal text-slate-400">¥</span></p>
                            <div class="flex justify-end gap-2 mt-0.5 text-[11px]">
                                <button onclick="editWalletItem('${item.id}')" class="text-blue-600 hover:underline font-medium">Sửa</button>
                                <span class="text-slate-300">|</span>
                                <button onclick="deleteWalletItem('${item.id}')" class="text-rose-500 hover:underline font-medium">Xóa</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    const totalBalanceMain = document.getElementById('ui-total-balance-main');
    const totalCreditEl = document.getElementById('ui-total-credit');
    const totalDebitEl = document.getElementById('ui-total-debit');

    if (totalBalanceMain) totalBalanceMain.innerText = grandTotal.toLocaleString() + ' ¥';
    if (totalCreditEl) totalCreditEl.innerText = totalCredit.toLocaleString() + ' ¥';
    if (totalDebitEl) totalDebitEl.innerText = totalDebit.toLocaleString() + ' ¥';
}

function toggleWalletFields() {
    const typeSelect = document.getElementById('f-wallet-type');
    const creditFields = document.getElementById('credit-fields');
    if (!typeSelect || !creditFields) return;
    
    if (typeSelect.value === 'CREDIT') {
        creditFields.classList.remove('hidden');
    } else {
        creditFields.classList.add('hidden');
    }
}

function openWalletModal() {
    document.getElementById('f-wallet-id').value = '';
    document.getElementById('f-wallet-name').value = '';
    document.getElementById('f-wallet-type').value = 'CREDIT';
    document.getElementById('f-wallet-balance').value = '';
    document.getElementById('f-wallet-limit').value = '';
    document.getElementById('f-wallet-closing').value = '';
    document.getElementById('f-wallet-due').value = '';
    toggleWalletFields();
    document.getElementById('wallet-modal-title').innerText = 'Thêm Ví Mới';
    document.getElementById('wallet-modal').classList.remove('hidden');
}

function editWalletItem(id) {
    const item = walletData.find(w => w.id === id);
    if (!item) return;

    document.getElementById('f-wallet-id').value = item.id;
    document.getElementById('f-wallet-name').value = item.name;
    document.getElementById('f-wallet-type').value = item.type;
    document.getElementById('f-wallet-balance').value = item.current_balance;
    document.getElementById('f-wallet-limit').value = item.credit_limit || '';
    document.getElementById('f-wallet-closing').value = item.closing_date || '';
    document.getElementById('f-wallet-due').value = item.due_date || '';
    toggleWalletFields();
    document.getElementById('wallet-modal-title').innerText = 'Chỉnh sửa Ví';
    document.getElementById('wallet-modal').classList.remove('hidden');
}

function closeWalletModal() {
    document.getElementById('wallet-modal').classList.add('hidden');
}

function handleWalletSubmit(e) {
    e.preventDefault();
    const id = document.getElementById('f-wallet-id').value || `W${Date.now().toString().slice(-4)}`;
    const name = document.getElementById('f-wallet-name').value;
    const type = document.getElementById('f-wallet-type').value;
    const current_balance = Number(document.getElementById('f-wallet-balance').value);
    const credit_limit = type === 'CREDIT' ? Number(document.getElementById('f-wallet-limit').value) : null;
    const closing_date = type === 'CREDIT' ? document.getElementById('f-wallet-closing').value : null;
    const due_date = type === 'CREDIT' ? document.getElementById('f-wallet-due').value : null;

    const payload = { id, name, type, credit_limit, closing_date, due_date, current_balance };

    const existingIndex = walletData.findIndex(w => w.id === id);
    if (existingIndex >= 0) {
        walletData[existingIndex] = payload;
    } else {
        walletData.push(payload);
    }
    
    closeWalletModal();
    renderWalletUI();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withFailureHandler(function(err) {
                console.error("Lưu ví thất bại: ", err);
                loadWalletsData(true);
            })
            .saveWalletToSheet(payload);
    }
}

function deleteWalletItem(id) {
    if (confirm('Bạn có chắc chắn muốn xóa ví này không?')) {
        walletData = walletData.filter(w => w.id !== id);
        renderWalletUI();

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withFailureHandler(function(err) {
                    console.error("Xóa thất bại: ", err);
                    loadWalletsData(true);
                })
                .deleteWalletFromSheet(id);
        }
    }
}
</script>
