<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Đơn Hàng & Kho</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 font-sans pb-20">

<div class="max-w-md mx-auto p-3 space-y-4">

  <!-- TOAST -->
  <div id="toastMessage" class="hidden fixed top-16 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-white text-xs font-semibold shadow-lg"></div>

  <!-- ===================================================== -->
  <!-- KHỐI THỐNG KÊ CƠ BẢN PHÍA TRÊN (ĐỒNG BỘ GIAO DIỆN THU CHI) -->
  <!-- ===================================================== -->
  <div class="bg-gradient-to-br from-rose-500 to-pink-600 text-white p-4 rounded-3xl shadow-lg relative overflow-hidden space-y-3">
      <div class="flex justify-between items-center">
          <div>
              <p class="text-[10px] uppercase tracking-wider text-pink-100 font-medium">Hệ Thống Kinh Doanh</p>
              <h2 class="text-sm font-bold">Tổng Quan Tháng</h2>
          </div>
          <select id="filter-business-month" onchange="renderBusinessModule()" class="bg-white/20 hover:bg-white/30 text-white text-xs font-semibold px-2.5 py-1 rounded-xl border border-white/20 backdrop-blur-md focus:outline-none cursor-pointer">
              <option value="all" class="text-slate-800">Cả năm</option>
              <option value="1" class="text-slate-800">Tháng 1</option>
              <option value="2" class="text-slate-800">Tháng 2</option>
              <option value="3" class="text-slate-800">Tháng 3</option>
              <option value="4" class="text-slate-800">Tháng 4</option>
              <option value="5" class="text-slate-800">Tháng 5</option>
              <option value="6" class="text-slate-800">Tháng 6</option>
              <option value="7" class="text-slate-800">Tháng 7</option>
              <option value="8" class="text-slate-800" selected>Tháng 8</option>
              <option value="9" class="text-slate-800">Tháng 9</option>
              <option value="10" class="text-slate-800">Tháng 10</option>
              <option value="11" class="text-slate-800">Tháng 11</option>
              <option value="12" class="text-slate-800">Tháng 12</option>
          </select>
      </div>

      <div>
          <p class="text-[10px] uppercase tracking-wider text-pink-100">Lợi Nhuận Gộp </p>
          <p id="ui-biz-net" class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-0.5">0 ¥</p>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-2.5 border-t border-white/15">
          <div>
              <p class="text-[9px] uppercase tracking-wider text-pink-100">Tổng Doanh Thu </p>
              <p id="ui-biz-revenue" class="text-xs sm:text-sm font-bold text-white mt-0.5">0 ¥</p>
          </div>
          <div>
              <p class="text-[9px] uppercase tracking-wider text-pink-100">Tổng Vốn Mua </p>
              <p id="ui-biz-purchase" class="text-xs sm:text-sm font-bold text-white mt-0.5">0 ¥</p>
          </div>
      </div>

      <!-- PHẦN BỔ SUNG: THỐNG KÊ HÀNG TỒN & VỐN TỒN -->
      <div class="grid grid-cols-2 gap-2 pt-2.5 border-t border-white/15 bg-black/10 -mx-4 -mb-4 p-4 rounded-b-3xl">
          <div>
              <p class="text-[9px] uppercase tracking-wider text-pink-100">📦 Tổng Hàng Tồn Kho</p>
              <p id="ui-biz-stock-qty" class="text-xs sm:text-sm font-bold text-white mt-0.5">0 SP</p>
          </div>
          <div>
              <p class="text-[9px] uppercase tracking-wider text-pink-100">💰 Tổng Vốn Tồn Kho</p>
              <p id="ui-biz-stock-capital" class="text-xs sm:text-sm font-bold text-white mt-0.5">0 ¥</p>
          </div>
      </div>
  </div>

  <!-- TAB NAVIGATION (Đúng 3 Tab Gốc) -->
  <div class="grid grid-cols-3 gap-1 bg-slate-200 p-1 rounded-2xl">
    <button onclick="switchTab('mua')" id="btnTabMua" class="py-2.5 text-xs font-bold rounded-xl transition bg-white text-blue-600 shadow-sm">1. Mua Hàng</button>
    <button onclick="switchTab('ban')" id="btnTabBan" class="py-2.5 text-xs font-bold rounded-xl transition text-slate-600">2. Bán Hàng</button>
    <button onclick="switchTab('khoNo')" id="btnTabKhoNo" class="py-2.5 text-xs font-bold rounded-xl transition text-slate-600">3. Cập nhật </button>
  </div>

  <!-- ===================================================== -->
  <!-- TAB 1 - MUA HÀNG (PURCHASE) -->
  <!-- ===================================================== -->
  <div id="tab-mua" class="space-y-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
    <h2 class="text-base font-bold text-slate-700 border-b pb-2">Nhập Đơn Mua Hàng (Purchase)</h2>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Sàn Mua:</label>
        <input type="text" id="sanMua" placeholder="VD: Mercari, Amazon..." class="w-full border rounded-xl px-3 py-2 text-sm bg-white" />
      </div>

      <div class="relative">
        <label class="block text-xs font-semibold text-slate-600 mb-1">Thẻ Thanh Toán:</label>
        <input type="text" id="inputTheQuet" placeholder="Gõ tìm thẻ..." oninput="locDanhSachThe()" autocomplete="off" class="w-full border rounded-xl px-3 py-2 text-sm bg-white" />
        <div id="dropdownGoiY" class="hidden absolute z-50 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto"></div>
      </div>
    </div>

    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-600">Danh Sách SP:</label>
        <button onclick="themDongSanPham()" class="text-xs text-blue-600 font-bold">+ Thêm SP</button>
      </div>

      <div id="danhSachSPContainer" class="space-y-3">
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2.5 sp-row">
          <input type="text" placeholder="Tên sản phẩm" class="sp-ten w-full border rounded-lg px-3 py-2 text-sm bg-white" />
          <div class="grid grid-cols-2 gap-2">
            <input type="number" placeholder="Số lượng" value="1" min="1" class="sp-sl w-full border rounded-lg px-3 py-2 text-sm bg-white" />
            <input type="number" placeholder="Giá (Yên)" min="0" class="sp-gia w-full border rounded-lg px-3 py-2 text-sm bg-white" />
          </div>
          <select class="sp-trangThaiKho w-full border rounded-lg px-3 py-2 text-sm bg-white">
            <option value="📦 Chờ Ship">📦 Chờ Ship</option>
            <option value="🟢 Kho 1F">🟢 Kho 1F</option>
            <option value="✴️ Kho 2F">✴️ Kho 2F</option>
          </select>
        </div>
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Ghi Chú:</label>
      <input type="text" id="ghiChuDon" placeholder="Ghi chú đơn hàng..." class="w-full border rounded-xl px-3 py-2 text-sm bg-white" />
    </div>

    <button onclick="guiDonMuaHang()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md">💾 Lưu Đơn Mua Hàng</button>
  </div>

  <!-- ===================================================== -->
  <!-- TAB 2 - BÁN HÀNG (SALES) -->
  <!-- ===================================================== -->
  <div id="tab-ban" class="hidden space-y-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
    <h2 class="text-base font-bold text-slate-700 border-b pb-2">Tạo Đơn Bán Hàng (Sales)</h2>

    <form id="formBan" onsubmit="submitBan(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-2">Danh Sách Sản Phẩm Bán:</label>
        <div id="danhSachBanContainer" class="space-y-3"></div>
        <button type="button" onclick="themDongBan()" class="mt-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-sm">+ Thêm sản phẩm bán</button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Trạng Thái Thanh Toán:</label>
          <select id="trangThaiTT" required class="w-full border rounded-xl px-3 py-2 text-sm">
            <option value="🟡 Chờ thu">🟡 Chờ thu</option>
            <option value="🟢 Đã thanh toán">🟢 Đã thanh toán</option>
          </select>
        </div>

        <div class="relative">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nguồn Nhận Tiền:</label>
          <input type="text" id="inputHinhThucNhan" placeholder="Gõ tìm nguồn..." oninput="locDanhSachNhanTienBan()" autocomplete="off" class="w-full border rounded-xl px-3 py-2 text-sm" />
          <div id="dropdownHinhThucNhanBan" class="hidden absolute z-50 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto"></div>
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow">💰 Lưu Đơn Bán Hàng</button>
    </form>
  </div>

  <!-- ===================================================== -->
  <!-- TAB 3 - KHO & NỢ -->
  <!-- ===================================================== -->
  <div id="tab-khoNo" class="hidden space-y-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
    <h2 class="text-base font-bold text-slate-700 border-b pb-2">Cập Nhật Thông Tin Kho & Nợ</h2>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-2">Loại Thao Tác:</label>
      <label class="flex items-center gap-2 text-sm mb-2">
        <input type="radio" name="radioLoai" value="suaChiTiet" checked onchange="onLoaiChange()"> 📝 Sửa chi tiết
      </label>
      <label class="flex items-center gap-2 text-sm mb-2">
        <input type="radio" name="radioLoai" value="capNhatKho" onchange="onLoaiChange()"> 📦 Cập nhật Kho
      </label>
      <label class="flex items-center gap-2 text-sm">
        <input type="radio" name="radioLoai" value="capNhatTT" onchange="onLoaiChange()"> 💰 Cập nhật Thanh Toán
      </label>
    </div>

    <div id="timSPSingleWrapper" class="relative">
      <label class="block text-xs font-semibold text-slate-600 mb-1">Tìm Tên Sản Phẩm:</label>
      <input type="text" id="inputTimSP" placeholder="Gõ tên sản phẩm..." oninput="locTimSP()" autocomplete="off" class="w-full border rounded-xl px-3 py-2 text-sm" />
      <input type="hidden" id="selectedRowIndex">
      <input type="hidden" id="selectedSheet">
      <div id="dropdownTimSP" class="hidden absolute z-50 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto"></div>
    </div>

    <div id="timSPMultiWrapper" class="hidden space-y-2">
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-600">Chọn Sản Phẩm (nhiều):</label>
        <button type="button" onclick="themDongTimSPMulti()" class="text-xs text-amber-600 font-bold">+ Thêm sản phẩm</button>
      </div>
      <div id="danhSachTimSPMultiContainer" class="space-y-2"></div>
    </div>

    <div id="formSuaChiTiet" class="space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs mb-1">Tên SP</label>
          <input type="text" id="suaTenSP" class="w-full border rounded-xl px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs mb-1">Số lượng</label>
          <input type="number" id="suaSoLuong" class="w-full border rounded-xl px-3 py-2 text-sm" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs mb-1">Giá</label>
          <input type="number" id="suaGia" class="w-full border rounded-xl px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs mb-1">Thẻ / Nguồn</label>
          <input type="text" id="suaSanThe" class="w-full border rounded-xl px-3 py-2 text-sm" />
        </div>
      </div>
    </div>

    <div id="formCapNhatKho" class="hidden">
      <label class="block text-xs mb-1">Trạng Thái Kho Mới:</label>
      <select id="selectKhoMoi" class="w-full border rounded-xl px-3 py-2 text-sm">
        <option value="📦 Chờ Ship">📦 Chờ Ship</option>
        <option value="🟢 Kho 1F">🟢 Kho 1F</option>
        <option value="✴️ Kho 2F">✴️ Kho 2F</option>
        <option value="❌ Huỷ">❌ Huỷ</option>
      </select>
    </div>

    <div id="formCapNhatTT" class="hidden space-y-2">
      <div>
        <label class="block text-xs mb-1">Trạng Thái Thanh Toán:</label>
        <select id="selectTTMoi" class="w-full border rounded-xl px-3 py-2 text-sm">
          <option value="🟡 Chờ thu">🟡 Chờ thu</option>
          <option value="🟢 Đã thanh toán">🟢 Đã thanh toán</option>
          <option value="❌ Huỷ">❌ Huỷ</option>
        </select>
      </div>
      <div class="relative">
        <label class="block text-xs mb-1">Nguồn Nhận Tiền:</label>
        <input type="text" id="inputHinhThucNhanCapNhat" placeholder="Gõ tìm nguồn..." oninput="locDanhSachNhanTienCapNhat()" autocomplete="off" class="w-full border rounded-xl px-3 py-2 text-sm" />
        <div id="dropdownHinhThucNhanCapNhat" class="hidden absolute z-50 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto"></div>
      </div>
    </div>

    <button onclick="guiCapNhat()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 rounded-xl shadow">⚡ Cập Nhật Ngay</button>
  </div>

</div>

<!-- ===================================================== -->
<!-- JAVASCRIPT XỬ LÝ -->
<!-- ===================================================== -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadDataFromSheets();
    });

    function switchTab(tabName) {
        const tabs = ['mua', 'ban', 'khoNo'];
        tabs.forEach(t => {
            const el = document.getElementById(`tab-${t}`);
            const btn = document.getElementById(`btnTab${t.charAt(0).toUpperCase() + t.slice(1)}`);
            if (el) el.classList.add('hidden');
            if (btn) {
                btn.className = "py-2.5 text-xs font-bold rounded-xl transition text-slate-600";
            }
        });

        const activeEl = document.getElementById(`tab-${tabName}`);
        const activeBtn = document.getElementById(`btnTab${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`);
        
        if (activeEl) activeEl.classList.remove('hidden');
        if (activeBtn) {
            activeBtn.className = "py-2.5 text-xs font-bold rounded-xl transition bg-white text-blue-600 shadow-sm";
        }
    }

    function loadDataFromSheets() {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(onGetDataSuccess)
                .withFailureHandler(onGetDataError)
                .getBusinessDataFromSheets();
        } else {
            console.log("Đang chạy môi trường Local (dùng dữ liệu mẫu).");
            window.purchaseList = [{ name: "Sản phẩm mẫu", month: 8, amount: 45000, quantity: 2, stockStatus: "🟢 Kho 1F" }];
            window.salesList = [{ name: "Sản phẩm mẫu", month: 8, amount: 75000 }];
            window.stockList = [{ quantity: 2, amount: 45000 }]; // Dữ liệu mẫu kho tồn
            renderBusinessModule();
        }
    }

    function onGetDataSuccess(data) {
        try {
            const res = typeof data === 'string' ? JSON.parse(data) : data;
            window.purchaseList = res.purchaseList || [];
            window.salesList = res.salesList || [];
            window.businessSummary = res.businessSummary || [];
            window.stockList = res.stockList || []; // Nhận thêm dữ liệu tồn kho từ Google Sheets (nếu backend trả về)

            renderBusinessModule();
            showToast("Đã đồng bộ dữ liệu từ Sheet!", "success");
        } catch (e) {
            console.error("Lỗi phân tích dữ liệu:", e);
        }
    }

    function onGetDataError(error) {
        console.error("Lỗi gọi Apps Script:", error);
    }

    function renderBusinessModule() {
        const selectedMonth = document.getElementById('filter-business-month').value;
        let salesData = window.salesList || [];
        let purchaseData = window.purchaseList || [];

        let totalRevenue = 0;
        let totalPurchase = 0;

        salesData.forEach(item => {
            if (selectedMonth === 'all' || item.month.toString() === selectedMonth) {
                totalRevenue += Number(item.amount || 0);
            }
        });

        purchaseData.forEach(item => {
            if (selectedMonth === 'all' || item.month.toString() === selectedMonth) {
                totalPurchase += Number(item.amount || 0);
            }
        });

        let netProfit = totalRevenue - totalPurchase;
        document.getElementById('ui-biz-revenue').innerText = totalRevenue.toLocaleString() + " ¥";
        document.getElementById('ui-biz-purchase').innerText = totalPurchase.toLocaleString() + " ¥";
        
        const uiNet = document.getElementById('ui-biz-net');
        if (uiNet) {
            uiNet.innerText = netProfit.toLocaleString() + " ¥";
            uiNet.className = `text-2xl sm:text-3xl font-extrabold tracking-tight mt-0.5 ${netProfit >= 0 ? 'text-white' : 'text-amber-200'}`;
        }

        // TÍNH TOÁN & HIỂN THỊ THÔNG KÊ HÀNG TỒN & VỐN TỒN
        let totalStockQty = 0;
        let totalStockCapital = 0;

        // Nếu có mảng stockList riêng từ backend
        if (window.stockList && window.stockList.length > 0) {
            window.stockList.forEach(item => {
                totalStockQty += Number(item.quantity || 0);
                totalStockCapital += Number(item.amount || 0);
            });
        } else {
            // Hoặc tự tính dựa trên purchaseList lọc các sản phẩm chưa bán / còn ở kho (ví dụ dựa vào trạng thái kho hoặc danh sách mua chưa bị trừ)
            purchaseData.forEach(item => {
                // Kiểm tra nếu sản phẩm còn nằm trong kho (ví dụ không tính các trạng thái Huỷ)
                if (item.stockStatus !== "❌ Huỷ") {
                    totalStockQty += Number(item.quantity || 1);
                    totalStockCapital += Number(item.amount || 0);
                }
            });
        }

        document.getElementById('ui-biz-stock-qty').innerText = totalStockQty.toLocaleString() + " SP";
        document.getElementById('ui-biz-stock-capital').innerText = totalStockCapital.toLocaleString() + " ¥";
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toastMessage');
        if (!toast) return;
        toast.innerText = message;
        toast.className = `fixed top-16 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-white text-xs font-semibold shadow-lg ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
        toast.classList.remove('hidden');
        setTimeout(() => { toast.classList.add('hidden'); }, 3000);
    }
</script>

</body>
</html>
