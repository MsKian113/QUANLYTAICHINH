<div class="space-y-4">
    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs">
        <div>
            <h2 class="text-lg font-bold text-slate-900">Quản Lý Công Nợ</h2>
            <p class="text-xs text-slate-500">Theo dõi các khoản phải thu và phải trả</p>
        </div>
        <button onclick="openDebtModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Thêm mới
        </button>
    </div>

    <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Tổng Phải Thu</p>
            <p id="ui-total-thu-debt" class="text-xl sm:text-2xl font-bold text-emerald-600 mt-1">0 ¥</p>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Tổng Phải Trả</p>
            <p id="ui-total-tra-debt" class="text-xl sm:text-2xl font-bold text-rose-600 mt-1">0 ¥</p>
        </div>
    </div>

    <div id="debt-card-container" class="space-y-3">
        </div>
</div>

<div id="debt-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 hidden">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
            <h3 id="debt-modal-title" class="text-lg font-bold text-slate-900">Thêm Khoản Nợ Mới</h3>
            <button onclick="closeDebtModal()" class="text-slate-400 hover:text-slate-600 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form id="debt-form-element" onsubmit="handleDebtSubmit(event)" class="space-y-4">
            <input type="hidden" id="f-debt-id">
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ngày</label>
                    <input type="date" id="f-debt-date" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Phạm vi</label>
                    <select id="f-debt-scope" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                        <option value="Gia đình">Gia đình</option>
                        <option value="Kinh doanh">Kinh doanh</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Loại nợ</label>
                <select id="f-debt-type" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                    <option value="PTrả - Mượn TM">PTrả - Mượn TM (Phải trả)</option>
                    <option value="PThu - Cho vay TM">PThu - Cho vay TM (Phải thu)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Đối tượng</label>
                    <input type="text" id="f-debt-counterparty" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" placeholder="Tên người/đơn vị">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Số tiền (¥)</label>
                    <input type="number" id="f-debt-amount" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" placeholder="10000">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nguồn tiền thanh toán</label>
                <select id="f-debt-wallet" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                    <option value="C- Raku KA">C- Raku KA</option>
                    <option value="C- Yodo KA">C- Yodo KA</option>
                    <option value="Resona">Resona</option>
                    <option value="Tiền mặt">Tiền mặt</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nội dung</label>
                <input type="text" id="f-debt-description" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" placeholder="Nội dung khoản nợ...">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Trạng thái</label>
                    <select id="f-debt-status" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                        <option value="Chưa TT">Chưa thanh toán</option>
                        <option value="Đã TT">Đã thanh toán</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ngày thanh toán</label>
                    <input type="date" id="f-debt-payment-date" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                </div>
            </div>

            <div class="flex gap-3 pt-4 border-t border-slate-100">
                <button type="button" onclick="closeDebtModal()" class="flex-1 px-4 py-3 border border-slate-300 rounded-xl text-slate-600 text-sm font-semibold hover:bg-slate-50 transition">Hủy</button>
                <button type="submit" class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-sm transition">Lưu lại</button>
            </div>
        </form>
    </div>
</div>

<script>
    let debtData = [
        { id: 'DEBT01', date: '2026-01-01', scope: 'Gia đình', debt_type: 'PTrả - Mượn TM', counterparty: 'Nguyễn Văn A', description: 'Mượn tiền mặt mua hàng', wallet: 'C- Raku KA', amount: 539, status: 'Đã TT', payment_date: '2026-01-02' }
    ];

    function renderDebtUI() {
        const container = document.getElementById('debt-card-container');
        container.innerHTML = '';

        let totalThu = 0;
        let totalTra = 0;

        debtData.forEach(item => {
            const isPhaiThu = item.debt_type.includes('PThu');
            if (isPhaiThu) {
                totalThu += item.amount;
            } else {
                totalTra += item.amount;
            }

            const isPaid = item.status === 'Đã TT';

            const card = `
                <div class="bg-white border border-slate-200/80 rounded-2xl p-4 sm:p-5 shadow-xs flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-[11px] font-mono font-bold text-slate-400">${item.id} • ${item.scope}</span>
                                <h3 class="text-base sm:text-lg font-bold text-slate-900">${item.description}</h3>
                            </div>
                            <span class="text-[11px] px-2.5 py-1 rounded-lg font-bold tracking-wide ${isPhaiThu ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 'bg-rose-50 text-rose-700 border border-rose-100'}">
                                ${item.debt_type}
                            </span>
                        </div>

                        <div class="my-2 flex justify-between items-center">
                            <span class="text-xs text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg font-medium">Đối tượng: <strong>${item.counterparty}</strong></span>
                            <p class="text-xl sm:text-2xl font-bold ${isPhaiThu ? 'text-emerald-600' : 'text-rose-600'}">
                                ${item.amount.toLocaleString()} ¥
                            </p>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-3 mt-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs text-slate-500">
                        <div>
                            <span>Ví: <strong class="text-slate-700">${item.wallet}</strong></span>
                            <span class="mx-1.5 text-slate-300">|</span>
                            <span class="px-2 py-0.5 rounded font-semibold ${isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${item.status}</span>
                            ${item.payment_date ? `<span class="ml-1.5 text-slate-400">(${item.payment_date})</span>` : ''}
                        </div>

                        <div class="flex gap-2 w-full sm:w-auto justify-end">
                            <button onclick="editDebtItem('${item.id}')" class="flex-1 sm:flex-none text-slate-600 hover:text-blue-600 text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-200 hover:border-blue-300 hover:bg-blue-50/50 transition text-center">Sửa</button>
                            <button onclick="deleteDebtItem('${item.id}')" class="flex-1 sm:flex-none text-slate-600 hover:text-rose-600 text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-200 hover:border-rose-300 hover:bg-rose-50/50 transition text-center">Xóa</button>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });

        document.getElementById('ui-total-thu-debt').innerText = totalThu.toLocaleString() + ' ¥';
        document.getElementById('ui-total-tra-debt').innerText = totalTra.toLocaleString() + ' ¥';
    }

    function openDebtModal() {
        document.getElementById('f-debt-id').value = '';
        document.getElementById('f-debt-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('f-debt-scope').value = 'Gia đình';
        document.getElementById('f-debt-type').value = 'PTrả - Mượn TM';
        document.getElementById('f-debt-counterparty').value = '';
        document.getElementById('f-debt-amount').value = '';
        document.getElementById('f-debt-wallet').value = 'C- Raku KA';
        document.getElementById('f-debt-description').value = '';
        document.getElementById('f-debt-status').value = 'Chưa TT';
        document.getElementById('f-debt-payment-date').value = '';
        document.getElementById('debt-modal-title').innerText = 'Thêm Khoản Nợ Mới';
        document.getElementById('debt-modal').classList.remove('hidden');
    }

    function editDebtItem(id) {
        const item = debtData.find(d => d.id === id);
        if (!item) return;

        document.getElementById('f-debt-id').value = item.id;
        document.getElementById('f-debt-date').value = item.date;
        document.getElementById('f-debt-scope').value = item.scope;
        document.getElementById('f-debt-type').value = item.debt_type;
        document.getElementById('f-debt-counterparty').value = item.counterparty;
        document.getElementById('f-debt-amount').value = item.amount;
        document.getElementById('f-debt-wallet').value = item.wallet;
        document.getElementById('f-debt-description').value = item.description;
        document.getElementById('f-debt-status').value = item.status;
        document.getElementById('f-debt-payment-date').value = item.payment_date || '';
        document.getElementById('debt-modal-title').innerText = 'Chỉnh sửa Khoản Nợ';
        document.getElementById('debt-modal').classList.remove('hidden');
    }

    function closeDebtModal() {
        document.getElementById('debt-modal').classList.add('hidden');
    }

    function handleDebtSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('f-debt-id').value;
        const date = document.getElementById('f-debt-date').value;
        const scope = document.getElementById('f-debt-scope').value;
        const debt_type = document.getElementById('f-debt-type').value;
        const counterparty = document.getElementById('f-debt-counterparty').value;
        const amount = Number(document.getElementById('f-debt-amount').value);
        const wallet = document.getElementById('f-debt-wallet').value;
        const description = document.getElementById('f-debt-description').value;
        const status = document.getElementById('f-debt-status').value;
        const payment_date = document.getElementById('f-debt-payment-date').value;

        if (id) {
            debtData = debtData.map(d => d.id === id ? { ...d, date, scope, debt_type, counterparty, amount, wallet, description, status, payment_date } : d);
        } else {
            const newId = `DEBT0${debtData.length + 1}`;
            debtData.push({ id: newId, date, scope, debt_type, counterparty, amount, wallet, description, status, payment_date });
        }

        closeDebtModal();
        renderDebtUI();
    }

    function deleteDebtItem
