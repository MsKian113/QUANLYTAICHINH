<script>
/* ========================================================================== */
/* 1. KHỞI TẠO BIẾN TOÀN CỤC & TRẠNG THÁI HỆ THỐNG                            */
/* ========================================================================== */
let familyData = [];                  // Lưu trữ danh sách tất cả giao dịch
let familyWalletList = [];            // Danh sách nguồn tiền (ví, tài khoản)
let familyHuList = [];                // Danh sách tên các Hũ (lấy từ cột B sheet Categories)
let familyNoiDungMauList = [];        // Danh sách nội dung mẫu gợi ý
let familyCachedFixedTemplates = null;// Cache các khoản cố định hàng tháng
let familyCurrentTab = 'expense';     // Tab hiện tại ('expense': Khoản chi, 'income': Khoản thu, 'stats': Thống kê)


/* ========================================================================== */
/* 2. KHỞI TẠO VÀ ĐIỀU HƯỚNG GIAO DIỆN CHUNG (RENDER & NAVIGATION)            */
/* ========================================================================== */

// Hàm khởi tạo chính khi load trang, gắn sự kiện cho các thành phần UI
function renderFamilyFinancials() {
    const currentYear = new Date().getFullYear();
    const currentMonth = new Date().getMonth() + 1;

    const yearDisp = document.getElementById('gd-currentYearDisplay');
    const monthSel = document.getElementById('gd-monthSelector');

    if (yearDisp) yearDisp.innerText = `Năm ${currentYear}`;
    if (monthSel && !monthSel.dataset.initialized) {
        monthSel.value = currentMonth;
        monthSel.addEventListener('change', function() {
            familyUpdateDashboard();
        });
        monthSel.dataset.initialized = "true";
    }

    // Gắn sự kiện chuyển tab (Khoản Chi / Khoản Thu / Thống kê)
    const tabExpense = document.getElementById('gd-tabExpense');
    const tabIncome = document.getElementById('gd-tabIncome');
    const tabStats = document.getElementById('gd-tabStats');

    if (tabExpense && !tabExpense.dataset.initialized) {
        tabExpense.addEventListener('click', () => familySwitchTab('expense'));
        tabIncome.addEventListener('click', () => familySwitchTab('income'));
        if (tabStats) tabStats.addEventListener('click', () => familySwitchTab('stats'));
        tabExpense.dataset.initialized = "true";
    }

    // Gắn sự kiện cho các nút thao tác nhanh ở dưới đáy
    const btnQuickAdd = document.getElementById('gd-btnQuickAdd');
    const btnNewTx = document.getElementById('gd-btnNewTx');
    if (btnQuickAdd && !btnQuickAdd.dataset.initialized) {
        btnQuickAdd.addEventListener('click', familyOpenQuickModal);
        btnNewTx.addEventListener('click', () => familyOpenModal('new'));
        btnQuickAdd.dataset.initialized = "true";
    }

    setupOutsideClickClose([
        { input: 'gd-fSource',  dropdown: 'gd-dropdownNguon'   },
        { input: 'gd-fJar',     dropdown: 'gd-dropdownHu'      },
        { input: 'gd-fContent', dropdown: 'gd-dropdownNoiDung' }
    ]);

    if (familyData.length === 0) {
        familyLoadDataFromSheet();
    } else {
        familyUpdateDashboard();
    }
}

// Xử lý chuyển đổi qua lại giữa các tab và điều phối hiển thị nút ở thanh dưới cùng
function familySwitchTab(tabType) {
    familyCurrentTab = tabType;
    const btnExpense = document.getElementById('gd-tabExpense');
    const btnIncome = document.getElementById('gd-tabIncome');
    const btnStats = document.getElementById('gd-tabStats');
    
    if (btnExpense && btnIncome && btnStats) {
        btnExpense.classList.toggle('gd-active', tabType === 'expense');
        btnIncome.classList.toggle('gd-active', tabType === 'income');
        btnStats.classList.toggle('gd-active', tabType === 'stats');
    }

    // Điều khiển ẩn/hiện nút ở thanh dưới cùng (Tab Thống kê hiện nút Cấu hình %, các tab khác hiện nút Hóa đơn/Mới)
    const defaultActions = document.getElementById('gd-defaultActions');
    const statsActions = document.getElementById('gd-statsActions');
    if (defaultActions && statsActions) {
        if (tabType === 'stats') {
            defaultActions.style.display = 'none';
            statsActions.style.display = 'flex';
        } else {
            defaultActions.style.display = 'flex';
            statsActions.style.display = 'none';
        }
    }

    const container = document.getElementById('gd-txListContainer');
    if (!container) return;

    if (tabType === 'stats') {
        container.innerHTML = familyRenderJarStatsHTML();
        familyCalculateJarStats();
    } else {
        familyRenderTransactionList();
    }
}

// Trích xuất tháng từ chuỗi ngày định dạng DD/MM/YYYY
function familyGetMonthFromDate(dateStr) {
    if (!dateStr) return "";
    const parts = String(dateStr).trim().split("/");
    return parts.length >= 2 ? parts[1].trim() : "";
}

// Cập nhật tổng quan số liệu Thu, Chi, Số dư ròng theo tháng được chọn
function familyUpdateDashboard() {
    const monthSel = document.getElementById('gd-monthSelector');
    if (!monthSel) return;
    const selectedMonth = monthSel.value;

    let totalIncome = 0, totalExpense = 0;
    familyData.forEach(row => {
        const matchMonth = selectedMonth === 'all' ||
            parseInt(familyGetMonthFromDate(row[1]), 10) === parseInt(selectedMonth, 10);
        if (!matchMonth) return;
        const type = String(row[2] || '').trim().toLowerCase();
        const amount = Number(row[3]) || 0;
        if (type === 'thu') totalIncome += amount;
        if (type === 'chi') totalExpense += amount;
    });

    const netCash = totalIncome - totalExpense;
    const incVal = document.getElementById('gd-totalIncomeVal');
    const expVal = document.getElementById('gd-totalExpenseVal');
    const netVal = document.getElementById('gd-netCashVal');
    if (incVal) incVal.innerText = totalIncome.toLocaleString() + ' ¥';
    if (expVal) expVal.innerText = totalExpense.toLocaleString() + ' ¥';
    if (netVal) netVal.innerText = (netCash >= 0 ? '+' : '') + netCash.toLocaleString() + ' ¥';

    if (familyCurrentTab === 'stats') {
        familyCalculateJarStats();
    } else {
        familyRenderTransactionList();
    }
}

// Render danh sách giao dịch chi tiết (sắp xếp ngày mới nhất lên trên)
function familyRenderTransactionList() {
    const monthSel = document.getElementById('gd-monthSelector');
    const container = document.getElementById('gd-txListContainer');
    if (!container || !monthSel) return;

    const selectedMonth = monthSel.value;
    let filteredRows = [];

    familyData.forEach((row, originalIndex) => {
        const matchMonth = selectedMonth === 'all' ||
            parseInt(familyGetMonthFromDate(row[1]), 10) === parseInt(selectedMonth, 10);
        const type = String(row[2] || '').trim().toLowerCase();
        const matchTab = (familyCurrentTab === 'income' && type === 'thu') ||
                         (familyCurrentTab === 'expense' && type === 'chi');
        if (matchMonth && matchTab) filteredRows.push({ row, originalIndex });
    });

    if (filteredRows.length === 0) {
        container.innerHTML = `<div class="gd-tx-empty text-xs py-3 text-slate-400 text-center">Không có giao dịch nào trong tháng này</div>`;
        return;
    }

    // Sắp xếp ngày mới nhất lên trên (Giảm dần theo định dạng YYYYMMDD)
    filteredRows.sort((a, b) => {
        const parseDate = (dateStr) => {
            if (!dateStr) return 0;
            const parts = String(dateStr).trim().split("/");
            if (parts.length < 3) return 0;
            return parseInt(parts[2] + parts[1].padStart(2, '0') + parts[0].padStart(2, '0'), 10);
        };
        return parseDate(b.row[1]) - parseDate(a.row[1]);
    });

    container.innerHTML = filteredRows.map(({ row, originalIndex }) => {
        const date = row[1] || '';
        const type = row[2] || '';
        const amount = Number(row[3]) || 0;
        const source = row[4] || '';
        const jar = row[5] || '';
        const content = row[6] || 'Không có nội dung';
        const isIncome = String(type).trim().toLowerCase() === 'thu';
        const typeClass = isIncome ? 'gd-income' : 'gd-expense';
        const sign = isIncome ? '+' : '-';

        // Rút gọn ngày: chỉ lấy DD/MM
        const dateParts = String(date).trim().split('/');
        const shortDate = dateParts.length >= 2 ? `${dateParts[0]}/${dateParts[1]}` : date;

        const subParts = [shortDate, source];
        if (jar) subParts.push(jar);
        const subText = subParts.filter(Boolean).join(' • ');

        // Ép sát tuyệt đối: padding cực mỏng, không margin, dùng border-left dạng phẳng thay vì vạch đỏ bo tròn tách rời
        const leftBorderColor = isIncome ? '#10b981' : '#ef4444';

        return `
            <div class="gd-tx-item" onclick="familyOpenDetailModal(${originalIndex})" style="padding: 2px 6px; margin: 0; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #f1f5f9; border-left: 3px solid ${leftBorderColor};">
                <div class="gd-tx-info-left" style="min-width: 0; padding-right: 6px;">
                    <div class="gd-tx-info-main" style="font-size: 11.5px; font-weight: 700; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1;">${content}</div>
                    <div class="gd-tx-info-sub" style="font-size: 10px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1;">${subText}</div>
                </div>
                <div class="gd-tx-amount" style="font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; color: ${leftBorderColor};">${sign}${amount.toLocaleString()} ¥</div>
            </div>`;
    }).join('');
}

            <div id="gd-jarsProgressList" style="display: flex; flex-direction: column; gap: 4px;">
                <div style="text-align: center; font-size: 0.72rem; color: #94a3b8; padding: 4px;">Đang tính toán dữ liệu hũ...</div>

// Tính toán chi tiêu thực tế từng hũ và vẽ thanh tiến độ tỷ lệ phần trăm
function familyCalculateJarStats() {
    const progressContainer = document.getElementById('gd-jarsProgressList');
    if (!progressContainer) return;

    const monthSel = document.getElementById('gd-monthSelector');
    const selectedMonth = monthSel ? monthSel.value : 'all';

    let jarSpentMap = {};
    let totalExpenseInMonth = 0;

    familyData.forEach(row => {
        const matchMonth = selectedMonth === 'all' ||
            parseInt(familyGetMonthFromDate(row[1]), 10) === parseInt(selectedMonth, 10);
        const type = String(row[2] || '').trim().toLowerCase();
        
        if (matchMonth && type === 'chi') {
            const amount = Number(row[3]) || 0;
            const jarName = String(row[5] || 'Khác').trim();
            
            totalExpenseInMonth += amount;
            jarSpentMap[jarName] = (jarSpentMap[jarName] || 0) + amount;
        }
    });

    if (!familyHuList || familyHuList.length === 0) {
        progressContainer.innerHTML = `<div style="text-align: center; font-size: 0.75rem; color: #94a3b8; padding: 8px;">Chưa có danh sách hũ ở sheet Categories.</div>`;
        return;
    }

    // CHỈ HIỂN THỊ CÁC HŨ CHI TIÊU (LỌC BỎ HŨ THU NHẬP)
    const expenseJars = familyHuList.filter(jar => String(jar).trim().toLowerCase() !== 'thu nhập');

    let html = '';
    expenseJars.forEach(jarName => {
        const spent = jarSpentMap[jarName] || 0;
        const percentOfTotal = totalExpenseInMonth > 0 ? ((spent / totalExpenseInMonth) * 100).toFixed(1) : 0;

        html += `
            <div style="background: #f8fafc; padding: 6px 8px; border-radius: 6px; border: 0.5px solid #e2e8f0; margin-bottom: 4px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px;">
                    <span style="font-size: 12px; font-weight: 600; color: #1e293b;">${jarName}</span>
                    <div>
                        <span style="font-size: 12px; font-weight: 700; color: #e91e63;">${spent.toLocaleString()} ¥</span>
                        <span style="font-size: 10px; color: #64748b; margin-left: 4px;">(${percentOfTotal}%)</span>
                    </div>
                </div>
                <div style="width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden;">
                    <div style="width: ${Math.min(percentOfTotal, 100)}%; height: 100%; background: #e91e63; border-radius: 2px;"></div>
                </div>
            </div>
        `;
    });

    progressContainer.innerHTML = html;
}

// Lưu hàng loạt các khoản cố định qua backend (Batch Save)
async function familySaveQuickEdits() {
    const container = document.getElementById('gd-quickListContainer');
    const modalOverlay = document.getElementById('gd-quickModal');
    const saveBtn = modalOverlay ? modalOverlay.querySelector('.gd-btn-save') : null;
    const notif = document.getElementById('qe-notification');
    
    if (!container) return;
    if (notif) notif.style.display = 'none';

    const rowsDivs = container.querySelectorAll('[data-template-name]');
    const itemsToSave = [];

    rowsDivs.forEach((div, index) => {
        const dateInput = document.getElementById(`qe-date-${index}`);
        const sourceInput = document.getElementById(`qe-source-${index}`);
        const amountInput = document.getElementById(`qe-amount-${index}`);
        if (!dateInput || !sourceInput || !amountInput) return;

        const newAmount = Number(amountInput.value) || 0;
        if (newAmount > 0) {
            itemsToSave.push({
                divElement: div,
                noiDung: div.getAttribute('data-template-name'),
                loai: div.getAttribute('data-loai') || 'Chi',
                hu: div.getAttribute('data-hu') || '',
                day: div.getAttribute('data-day') || 1,
                month: parseInt(div.getAttribute('data-month'), 10),
                year: parseInt(div.getAttribute('data-year'), 10),
                newDate: dateInput.value.trim(),
                newSource: sourceInput.value.trim(),
                newAmount
            });
        }
    });

    if (itemsToSave.length === 0) {
        showQuickNotification("⚠️ Vui lòng nhập số tiền cho ít nhất một khoản cần lưu!", "error");
        return;
    }

    if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerText = "Đang lưu hàng loạt...";
        saveBtn.style.opacity = "0.6";
        saveBtn.style.cursor = "not-allowed";
    }
    rowsDivs.forEach((_, idx) => {
        const dIn = document.getElementById(`qe-date-${idx}`);
        const sIn = document.getElementById(`qe-source-${idx}`);
        const aIn = document.getElementById(`qe-amount-${idx}`);
        if (dIn) dIn.disabled = true;
        if (sIn) sIn.disabled = true;
        if (aIn) aIn.disabled = true;
    });

    const payload = itemsToSave.map(item => ({
        noiDung: item.noiDung,
        loai: item.loai,
        hu: item.hu,
        day: item.day,
        month: item.month,
        year: item.year,
        newDate: item.newDate,
        newSource: item.newSource,
        newAmount: item.newAmount
    }));

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showQuickNotification("❌ Môi trường Google Apps Script không khả dụng.", "error");
        return;
    }

    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.success) {
                itemsToSave.forEach(it => {
                    const matchedRowIndex = familyData.findIndex(r => {
                        const rMonth = parseInt(familyGetMonthFromDate(r[1]), 10);
                        return rMonth === it.month && String(r[6]).trim().toLowerCase() === it.noiDung.toLowerCase();
                    });

                    if (matchedRowIndex !== -1) {
                        familyData[matchedRowIndex][1] = it.newDate;
                        familyData[matchedRowIndex][3] = it.newAmount;
                        familyData[matchedRowIndex][4] = it.newSource;
                    } else {
                        familyData.push(["TC" + Math.floor(10000 + Math.random() * 90000), it.newDate, it.loai, it.newAmount, it.newSource, it.hu, it.noiDung, "Khoản cố định hàng tháng"]);
                    }

                    if (it.divElement) it.divElement.remove();
                });

                familyUpdateDashboard();
                showQuickNotification(`🎉 Đã điền thành công ${itemsToSave.length} khoản cố định! Đang đóng...`, "success");
                
                setTimeout(() => {
                    familyCloseQuickModal();
                    if (notif) notif.style.display = 'none';
                }, 1200);
            } else {
                showQuickNotification("❌ Lỗi từ server: " + (res && res.message ? res.message : "Không rõ nguyên nhân"), "error");
                restoreInputs(rowsDivs, saveBtn);
            }
        })
        .withFailureHandler(function(err) {
            showQuickNotification("❌ Lỗi kết nối: " + err.message, "error");
            restoreInputs(rowsDivs, saveBtn);
        })
        .saveBatchQuickFixedAmounts(payload);
}

function restoreInputs(rowsDivs, saveBtn) {
    if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerText = "Lưu thay đổi";
        saveBtn.style.opacity = "1";
        saveBtn.style.cursor = "pointer";
    }
    rowsDivs.forEach((_, idx) => {
        const dIn = document.getElementById(`qe-date-${idx}`);
        const sIn = document.getElementById(`qe-source-${idx}`);
        const aIn = document.getElementById(`qe-amount-${idx}`);
        if (dIn) dIn.disabled = false;
        if (sIn) sIn.disabled = false;
        if (aIn) aIn.disabled = false;
    });
}

// Tải toàn bộ dữ liệu cấu hình và giao dịch từ Google Sheets backend
function familyLoadDataFromSheet() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) return;

    google.script.run.withSuccessHandler(function(data) { familyHuList = data || []; }).getDanhSachHuCategories();
    google.script.run.withSuccessHandler(function(data) { familyNoiDungMauList = data || []; }).getDanhSachNoiDungMau();
    google.script.run.withSuccessHandler(function(data) {
        familyData = data || [];
        familyUpdateDashboard();
    }).getFamilyData();
    google.script.run.withSuccessHandler(function(data) { familyWalletList = data || []; }).getWalletNamesList();

    google.script.run.withSuccessHandler(function(templates) {
        familyCachedFixedTemplates = templates || [];
    }).getFixedTransactions();
}

/* CẤU HÌNH VÀ THỐNG KÊ HŨ TÀI CHÍNH GIA ĐÌNH (NẠP TRƯỚC CACHE - TỐC ĐỘ 0 GIÂY)  */
/* ========================================================================== */

let familyBaseIncomeForConfig = 0;
const FIXED_INVESTMENT_AMOUNT = 60000; // Cố định 6 man cho NISA
let windowCachedJarData = null; // Biến cache lưu trữ dữ liệu sheet JAR

// 0. Hàm nạp sẵn cache ngầm ngay khi mở trang web
function preloadJarDataForCache() {
    if (windowCachedJarData) return;
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler(function(res) {
                if (res.success) {
                    windowCachedJarData = res.data;
                }
            })
            .getJarDataForWeb();
    }
}

// Hàm lấy dữ liệu siêu tốc từ cache
function fetchJarDataWithCacheInstant(callback) {
    if (windowCachedJarData) {
        callback(windowCachedJarData);
        return;
    }
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler(function(res) {
                if (res.success) {
                    windowCachedJarData = res.data;
                    callback(windowCachedJarData);
                } else {
                    callback(null);
                }
            })
            .withFailureHandler(() => callback(null))
            .getJarDataForWeb();
    } else {
        callback(null);
    }
}

// 1. Mở modal cấu hình %
function familyOpenJarConfigModal() {
    const modal = document.getElementById('gd-jarConfigModal');
    const container = document.getElementById('gd-jarConfigListContainer');
    const subtitle = document.getElementById('gd-jarConfigSubtitle');
    const notif = document.getElementById('gd-jarConfigNotif');
    
    if (!modal || !container) return;
    if (notif) notif.style.display = 'none';

    const monthSel = document.getElementById('gd-monthSelector');
    const currentMonthNum = monthSel && monthSel.value !== 'all' ? parseInt(monthSel.value, 10) : (new Date().getMonth() + 1);
    const targetPrevMonth = currentMonthNum === 1 ? 12 : currentMonthNum - 1;

    familyBaseIncomeForConfig = 0;
    if (typeof familyData !== 'undefined') {
        familyData.forEach(row => {
            const rowMonth = parseInt(familyGetMonthFromDate(row[1]), 10);
            const type = String(row[2] || '').trim().toLowerCase();
            if (rowMonth === targetPrevMonth && type === 'thu') {
                familyBaseIncomeForConfig += Number(row[3]) || 0;
            }
        });
    }

    if (subtitle) {
        subtitle.innerText = `Căn cứ thu tháng ${targetPrevMonth}: ${familyBaseIncomeForConfig.toLocaleString()} ¥ (Đầu tư NISA cố định: 60,000 ¥)`;
    }
    modal.style.display = 'flex';

    if (windowCachedJarData) {
        processAndRenderConfigForm(windowCachedJarData, container, currentMonthNum);
    } else {
        fetchJarDataWithCacheInstant(function(rows) {
            processAndRenderConfigForm(rows, container, currentMonthNum);
        });
    }
}

function processAndRenderConfigForm(rows, container, currentMonthNum) {
    let currentPercents = {};
    if (rows) {
        const monthColIndex = currentMonthNum;
        for (let i = 0; i < rows.length; i++) {
            const rowLabel = String(rows[i][0] || '').trim();
            if (rowLabel.startsWith('🏠')) {
                const jarName = rowLabel.replace('🏠', '').trim();
                const rawVal = Number(rows[i + 1][monthColIndex]) || 0;
                currentPercents[jarName] = Math.round(rawVal * 100);
            }
        }
    }
    renderJarConfigForm(container, currentMonthNum, currentPercents);
}

function renderJarConfigForm(container, currentMonthNum, currentPercents) {
    const allJars = (typeof familyHuList !== 'undefined' ? familyHuList : ["Thiết yếu", "Tiết kiệm", "Giáo dục", "Giải trí", "Cho đi", "Đầu tư"])
        .filter(jar => String(jar).trim().toLowerCase() !== 'thu nhập' && String(jar).trim().toLowerCase() !== 'kinh doanh');
    
    const flexibleJars = allJars.filter(jar => jar.toLowerCase() !== 'đầu tư');
    const defaultFlexiblePercent = flexibleJars.length > 0 ? Math.floor(100 / flexibleJars.length) : 0;

    let html = `
        <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #94a3b8; padding: 0 4px 4px 4px; border-bottom: 1px solid #e2e8f0;">
            <span>Hũ Chi tiêu</span>
            <span>Tỷ lệ (%) & Tiền quy đổi (Preview)</span>
        </div>
    `;

    html += `
        <div style="display: flex; justify-content: space-between; align-items: center; background: #fdf2f8; padding: 8px 10px; border-radius: 8px; border: 1px solid #fbcfe8; margin-bottom: 6px;">
            <div>
                <span style="font-size: 0.8rem; font-weight: 700; color: #be185d;">Đầu tư (NISA)</span>
                <div style="font-size: 0.65rem; color: #db2777;">Cố định hàng tháng</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 0.8rem; font-weight: 700; color: #be185d;">60,000 ¥</span>
            </div>
        </div>
    `;

    flexibleJars.forEach((jarName, index) => {
        const savedPct = currentPercents[jarName] !== undefined ? currentPercents[jarName] : defaultFlexiblePercent;

        html += `
            <div style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 6px;">
                <span style="font-size: 0.8rem; font-weight: 700; color: #1e293b;">${jarName}</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="jar-cfg-amt-${index}" style="font-size: 0.75rem; font-weight: 700; color: #64748b;">0 ¥</span>
                    <div style="display: flex; align-items: center; gap: 2px;">
                        <input type="number" 
                               id="jar-cfg-input-${index}" 
                               data-jar-name="${jarName}" 
                               value="${savedPct}" 
                               oninput="familyCalculateTotalJarPercent()"
                               style="width: 55px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px; font-size: 0.85rem; font-weight: 700; text-align: center; color: #e91e63; outline: none;"
                               min="0" max="100">
                        <span style="font-size: 0.8rem; font-weight: 700; color: #64748b;">%</span>
                    </div>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
    familyCalculateTotalJarPercent();
}

function familyCloseJarConfigModal() {
    const modal = document.getElementById('gd-jarConfigModal');
    if (modal) modal.style.display = 'none';
}

function familyCalculateTotalJarPercent() {
    const container = document.getElementById('gd-jarConfigListContainer');
    const totalSpan = document.getElementById('gd-jarConfigTotalPercent');
    if (!container || !totalSpan) return;

    const inputs = container.querySelectorAll('input[data-jar-name]');
    let total = 0;
    const remainingIncome = Math.max(0, familyBaseIncomeForConfig - FIXED_INVESTMENT_AMOUNT);

    inputs.forEach((input, index) => {
        const percentVal = Number(input.value) || 0;
        total += percentVal;

        const calculatedAmount = (remainingIncome * percentVal) / 100;
        const amtSpan = document.getElementById(`jar-cfg-amt-${index}`);
        if (amtSpan) {
            amtSpan.innerText = calculatedAmount.toLocaleString() + ' ¥';
        }
    });

    totalSpan.innerText = total;
    totalSpan.style.color = (total === 100) ? '#10b981' : '#e91e63';
}

// 3. Lưu cấu hình % (Cập nhật trực tiếp cache ngay lập tức)
function familySaveJarConfigs() {
    const container = document.getElementById('gd-jarConfigListContainer');
    const notif = document.getElementById('gd-jarConfigNotif');
    if (!container) return;

    const inputs = container.querySelectorAll('input[data-jar-name]');
    let total = 0;
    let configs = [];

    inputs.forEach(input => {
        const val = Number(input.value) || 0;
        total += val;
        configs.push({
            jarName: input.getAttribute('data-jar-name'),
            percent: val
        });
    });

    if (total !== 100) {
        if (notif) {
            notif.style.display = 'block';
            notif.style.background = '#fee2e2';
            notif.style.color = '#991b1b';
            notif.innerText = `⚠️ Tổng tỷ lệ % phải bằng đúng 100% (Hiện tại: ${total}%)`;
        }
        return;
    }

    const monthSel = document.getElementById('gd-monthSelector');
    const selectedMonth = monthSel && monthSel.value !== 'all' ? parseInt(monthSel.value, 10) : (new Date().getMonth() + 1);
    const currentYear = new Date().getFullYear();

    if (notif) {
        notif.style.display = 'block';
        notif.style.background = '#e0f2fe';
        notif.style.color = '#0369a1';
        notif.innerText = `⏳ Đang lưu...`;
    }

    if (windowCachedJarData) {
        const monthColIndex = selectedMonth;
        configs.forEach(cfg => {
            for (let i = 0; i < windowCachedJarData.length; i++) {
                const rowLabel = String(windowCachedJarData[i][0] || '').trim().toLowerCase();
                if (rowLabel.includes(cfg.jarName.toLowerCase())) {
                    windowCachedJarData[i + 1][monthColIndex] = cfg.percent / 100;
                    break;
                }
            }
        });
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler(function(res) {
                if (notif) {
                    notif.style.display = 'block';
                    notif.style.background = '#d1fae5';
                    notif.style.color = '#065f46';
                    notif.innerText = `🎉 Đã lưu thành công!`;
                }
                setTimeout(() => {
                    familyCloseJarConfigModal();
                    familyCalculateJarStats();
                }, 500);
            })
            .withFailureHandler(function(err) {
                windowCachedJarData = null;
                if (notif) {
                    notif.style.display = 'block';
                    notif.style.background = '#fee2e2';
                    notif.style.color = '#991b1b';
                    notif.innerText = `❌ Lỗi: ${err.message}`;
                }
            })
            .saveMonthlyJarConfig({ month: selectedMonth, year: currentYear, configs: configs });
    } else {
        setTimeout(() => {
            familyCloseJarConfigModal();
            familyCalculateJarStats();
        }, 500);
    }
}

// 4. Load thống kê lên web (Tốc độ tức thì nhờ dữ liệu đã preload sẵn)
function familyCalculateJarStats() {
    const progressContainer = document.getElementById('gd-jarsProgressList');
    if (!progressContainer) return;

    const monthSel = document.getElementById('gd-monthSelector');
    const selectedMonthCol = monthSel && monthSel.value !== 'all' ? parseInt(monthSel.value, 10) : (new Date().getMonth() + 1);
    const dataColIndex = selectedMonthCol;

    fetchJarDataWithCacheInstant(function(rows) {
        if (!rows) {
            progressContainer.innerHTML = `<div style="color: #ef4444; padding: 10px;">Không đọc được dữ liệu.</div>`;
            return;
        }

        let html = '';

        for (let i = 0; i < rows.length; i++) {
            const rowLabel = String(rows[i][0] || '').trim();

            if (rowLabel.startsWith('🏠')) {
                const jarName = rowLabel.replace('🏠', '').trim();
                
                const rawPct = Number(rows[i + 1][dataColIndex]) || 0;
                const jarConfigPercent = jarName.toLowerCase() === 'đầu tư' ? 'Cố định' : `${Math.round(rawPct * 100)}%`;

                const budget = Number(rows[i + 2][dataColIndex]) || 0;
                const spent = Number(rows[i + 3][dataColIndex]) || 0;
                const balance = Number(rows[i + 4][dataColIndex]) || 0;
                const carryOver = Number(rows[i + 5][dataColIndex]) || 0;

                const spentPercent = budget > 0 ? Math.min(Math.round((spent / budget) * 100), 100) : 0;
                const remainingPercent = Math.max(0, 100 - spentPercent);
                
                const barColor = spentPercent > 90 ? '#ef4444' : '#10b981';
                const jarLabel = jarName.toLowerCase() === 'đầu tư' ? 'Đầu tư (NISA - Cố định)' : jarName;

                html += `
                    <div style="background: #f8fafc; padding: 10px 12px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 8px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <span style="font-size: 0.85rem; font-weight: 800; color: #1e293b;">${jarLabel}</span>
                            <div style="display: flex; gap: 6px; font-size: 0.75rem;">
                                <span style="background: #e2e8f0; padding: 2px 5px; border-radius: 4px; color: #475569;">Hũ: <b>${jarConfigPercent}</b></span>
                                <span style="background: #fef2f2; padding: 2px 5px; border-radius: 4px; color: #e11d48;">Đã dùng: <b>${spentPercent}%</b></span>
                                <span style="background: #ecfdf5; padding: 2px 5px; border-radius: 4px; color: #059669;">Còn lại: <b>${remainingPercent}%</b></span>
                            </div>
                        </div>

                        <div style="width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-bottom: 8px;">
                            <div style="width: ${remainingPercent}%; height: 100%; background: ${barColor}; border-radius: 3px; transition: width 0.3s ease;"></div>
                        </div>

                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; font-size: 0.75rem; background: #ffffff; padding: 6px 8px; border-radius: 6px; border: 1px solid #f1f5f9;">
                            <div style="color: #475569;">🎯 Ngân sách: <b style="color: #0f172a;">${budget.toLocaleString()} ¥</b></div>
                            <div style="color: #475569;">💸 Đã chi: <b style="color: #e91e63;">${spent.toLocaleString()} ¥</b></div>
                            <div style="color: #475569;">✅ Số dư: <b style="color: ${balance >= 0 ? '#10b981' : '#ef4444'};">${balance.toLocaleString()} ¥</b></div>
                            <div style="color: #475569;">📊 Lũy kế: <b style="color: #3b82f6;">${carryOver.toLocaleString()} ¥</b></div>
                        </div>
                    </div>
                `;
            }
        }

        progressContainer.innerHTML = html || '<div style="color: #64748b; padding: 10px;">Không có dữ liệu hũ nào.</div>';
    });
}
